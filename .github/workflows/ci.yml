name: CI
on:
  push: { branches: [main] }   # une exécution sur main ; les PR passent par pull_request (fini le double run)
  pull_request:
jobs:
  dictee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Mesure du diagnostic de dictée (phrases) + levier grammaire
        run: python3 dictee/diag_sentence.py
      - name: Correcteur dys (détection + correction, sans corrigé)
        run: python3 dictee/correcteur_probe.py
      - name: Mover impératif — référence Python == cas
        run: python3 dictee/imperative_clitics.py
      - name: Garde anti-régression rappel (levier j'est être/avoir + FP) — recall_probe --check
        run: python3 dictee/recall_probe.py --check
      - name: Garde FP À L'ÉCHELLE (correcteur sur 2500 phrases correctes UD — plafond anti-régression, cf. audit 30/06)
        run: python3 dictee/fp_scale_probe.py --check
      # La sonde-sujet exige les ARBRES CoNLL-U (or nsubj), pas seulement des phrases → SAUTÉE en CI
      # (pas de $UDFR), comme les sondes dys. L'instrument est versionné : la mesure d'origine du
      # « mur sujet ~63 % » (DICTEE_ROADMAP) avait été perdue avec une mémoire de session cloud.
      - name: Sonde SUJET vs or UD nsubj (précision quand répond ≥90 % ; SAUTÉ sans UDFR)
        run: python3 dictee/sujet_probe.py
      # Le chantier « bases de genre désaccentuées » a traîné parce qu'AUCUN banc ne déclenchait
      # la table : la retirer ne changeait rien, et elle contenait « le »→féminin sans que rien
      # ne le voie. Ce banc ferme le trou — un chantier sans banc n'est pas un chantier.
      - name: Genre perdu par la DÉSACCENTUATION (âme/amé, affaire/affairé) — rappel + FP=0
        run: python3 dictee/gender_coll_probe.py --check
      - name: Garde FP SPELLER à l'échelle (ortho affirmatif sur 2500 UD — plafond anti-régression, baseline post-resserrage #107/#112)
        run: node dictee/speller_fp_scale_probe.js --check
      - name: Validation held-out (vocabulaire neuf)
        run: python3 dictee/eval_externe.py
      # LE SEUL BANC QUI N'EST PAS UNE REPRODUCTION. Les autres extraient la tranche moteur du HTML
      # et la ré-exécutent sous Node avec un bouchon DOM ; le jour où ce démarrage reproduit est faux,
      # tous les chiffres le sont sans que rien ne le signale (vécu : le moteur LIVRÉ ne chargeait
      # que le speller, donc la grammaire du nombre était muette). Ici Chrome ouvre la page, elle se
      # démarre elle-même, et on lit ce que l'utilisateur verrait.
      - name: Répétition espacée — planificateur Leitner (bloc pur du monolithe)
        run: node dictee/srs_probe.js
      - name: Navigateur RÉEL — Chrome pilote la page (CDP, zéro dépendance)
        run: node dictee/navigateur_probe.js --check
      # L'accessibilité se mesure dans le DOM RENDU, pas en comptant des attributs dans la source
      # (d83d972 : « compter des attributs mesure la syntaxe, pas l'accessibilité »). Vue ROUGE sur
      # l'app d'avant d83d972 (Entrée/Espace muets, 0 tabindex) avant d'être vue verte.
      - name: A11Y app réelle — aria-live, corrections au clavier, informatifs non tabbables
        run: node dictee/a11y_probe.js --check
      - name: EXTENSION dans Chrome — paquet réel, assets chargés par chrome.runtime.getURL
        run: node extension/navigateur_ext_probe.js --check
      - name: Précision par famille AU PRODUIT — extension réelle dans Chrome (sautée sans corpus dys privé)
        run: python3 dictee/dys_precision_probe.py --navigateur
      - name: Résiduel — tokens CORRECTS détruits (FP=0, plafond dur ; sauté sans corpus local)
        run: node dictee/residual_audit.js --check
      - name: "Collisions d’accent — non_verbe_acc.json == app == extension (Morphalou absent en CI, cohérence seulement)"
        run: python3 dictee/build_non_verbe_acc.py --check
      - name: "Lots Morphalou du speller — TSV commités bien formés (morph_na, morph_ver.gz)"
        run: python3 dictee/build_morph_lex.py --check
      - name: paquet de données ouvertes du site (omega-lexiques.zip frais)
        run: python3 build_lexiques.py --check
      - name: Boucle descendante (apprend le lexique de genre)
        run: python3 dictee/descending_probe.py
      - name: « did you mean » fréquence reste FALSIFIÉ (régression sur le cardinal FP=0)
        run: python3 dictee/didyoumean_probe.py
      - name: Extraction des tables g2p depuis l'app (route sublexicale)
        run: python3 dictee/build_g2p_tables.py
      - name: Extraction de la morphologie Lexique 4 (md/mb) depuis l'app
        run: python3 dictee/build_morpho.py
      - name: Boucle descendante — apprend la correction g2p (TRAIN)
        run: python3 dictee/build_g2p_corrections.py
      - name: Décomposeur « à la Lexique 4 » — mesure (HELD-OUT, in-lexique ⟂ OOV, seed 42)
        run: python3 dictee/decompose.py --measure
      - name: Cognition phono→ortho — apprend l'émission (build_p2g)
        run: python3 dictee/build_p2g.py
      - name: Cognition phono→ortho — mesure (HELD-OUT top-k + croisement ortho)
        run: python3 dictee/p2g.py --measure
      - name: Régression décomposeur + cognition (asserts + seuils mesurés)
        run: python3 dictee/test_decompose.py
      - name: Décomposition parallèle 3 voies (ortho/phon/grammaire) sur corpus réel
        run: python3 dictee/decompose_corpus.py --show
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Vérif syntaxe du bloc dictée+correcteur intégré (app)
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('app/omega-pendu.html','utf8');const i=h.indexOf('mode PHRASES');if(i<0)throw new Error('bloc dictée introuvable');const b=h.slice(h.lastIndexOf('<script>',i)+8,h.indexOf('</script>',i));new Function(b);console.log('OK: bloc dictée+correcteur se compile');"
      - name: Vérif syntaxe du bloc « Décompose » (script séparé, app)
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('app/omega-pendu.html','utf8');const i=h.indexOf('🔤 DÉCOMPOSE — fiche');if(i<0)throw new Error('bloc décompose introuvable');const b=h.slice(h.lastIndexOf('<script>',i)+8,h.indexOf('</script>',i));new Function(b);console.log('OK: bloc décompose se compile (séparé du correcteur)');"
      - name: Parité correcteur APP↔Python (homophones + accord sujet-verbe)
        run: node dictee/parity_corr.js
      - name: Parité POS-tagger HMM (Python == extension == app)
        run: node dictee/parity_pos.js
      - name: Correcteur orthographique app (décompression + non-régression AUTO FP=0)
        run: node dictee/test_speller_app.js
      - name: Benchmark dys réel (rappel plancher + FP=0 + garde anti-mauvaises-corrections)
        run: node dictee/messy_probe.js --check
      - name: Census vigilance dys (aucune orange juste perdue — SAUTÉ en CI, corpus privé local)
        run: python3 dictee/vig_census_probe.py
      - name: Précision par famille sur texte DYS réel (rouge/orange mesurés — SAUTÉ en CI, corpus privé local)
        run: python3 dictee/dys_precision_probe.py
      - name: Assets extension câblés (aucun asset livré-mais-muet — le trou des prénoms)
        run: node extension/assets_wired_probe.js
      - name: Angle mort ÉLISION (test différentiel l'X vs cet/cette X — plafond qui ne doit que baisser)
        run: node dictee/elision_probe.js --check
      - name: Mover impératif (parité app==extension + corrections + FP=0)
        run: node dictee/imp_probe.js --check
      - name: Clôture de paradigme de la conjugaison embarquée (accord sujet-verbe vérifiable)
        run: python3 dictee/close_conj_paradigm.py --check
      - name: POS-tagger 155k extrait du lexique embarqué (build_pos)
        run: python3 dictee/build_pos.py
      - name: Extension — extraction des lexiques depuis l'app (assets)
        run: python3 extension/build_assets.py
      - name: Extension — parité moteur dys-core ↔ Python (aucun FP propre)
        run: node extension/parity_core.js
      - name: Police de son — fraîcheur bloc app + parité clitiques ↔ Python + texte jamais altéré
        run: node police/parity_son.js
      - name: Parité OS-sujet 3 moteurs (orange « accord verbe à vérifier »)
        run: node dictee/parity_os.js
      - name: Parité ces/ses 3 moteurs (vigilance-enseignante)
        run: node dictee/parity_cesses.js
      # parity_corr vérifie « app ⊆ Python » : il attrape un FP de l'app, jamais un RETARD.
      # C'est ce qui s'était produit — Python corrigeait « la lettre », l'app non, et tout était vert.
      # Ici on exige l'ÉGALITÉ des trois rappels sur le MÊME échantillon (fourni par le Python).
      - name: Parité GENRE à clé partagée, 3 moteurs (âme/amé, affaire/affairé, lettre/lettré)
        run: node dictee/parity_gender_coll.js
      - name: Parité DICTÉE Python↔JS (diag_sentence.py == diagnoseSentence, 1300+ cas)
        run: node dictee/parity_diag.js
      - name: Dictée — SENT app == sentences.json + 0 FP
        run: python3 dictee/sentences_parity.py
      - name: Vigilance accord sujet-verbe (orange mid-phrase)
        run: node dictee/test_sv_vigilance.js
      - name: Garde anti-dérive — dev.sh lance bien ce que lance la CI
        run: python3 dictee/ci_parity_probe.py
      - name: Extension — speller ext ≡ app (couche vigilance comprise)
        run: node extension/test_speller.js
      - name: Parité SPELLER Python↔JS (suggestion — saute sans Lexique4, garde locale)
        run: python3 dictee/parity_speller.py
      - name: Extension — syntaxe dys-core / content / background / sidepanel / micro
        run: node --check extension/dys-core.js && node --check extension/content.js && node --check extension/background.js && node --check extension/sidepanel.js && node --check extension/micro.js
      - name: Moteur correcteur standalone (sans UI/DOM)
        run: node dictee/correcteur.js
      - name: Correcteur autonome (bake) — 3 mondes dont l'environnement CI
        run: node dictee/bake_probe.js --check
      - name: Outil d'édition du monolithe — auto-test des pièges
        run: python tools/omega_edit.py
      - name: Double-Sens — table de définitions + règle d'équité
        run: node dictee/sens_probe.js --check
      - name: Ponctuation vocale — règles BDL/OQLF + parité site/extension
        run: node dictee/proso_probe.js
      - name: Typographie ROUGE — espaces autour de « , » et « . » + parité
        run: node dictee/typo_probe.js
      - name: Miroir PONCTUATION app↔extension — 5 blocs miroités à la main
        run: node dictee/miroir_ponct_probe.js
      - name: Détection de QUESTION — précision ET rappel (saute sans data_local)
        run: node dictee/question_bench.js
      - name: Parité OCTET du moteur vocal — site == extension
        run: node dictee/voix_parite_probe.js
      - name: Audit structurel du pipeline vocal — 4000 dictées, chaînage et conflits
        run: node dictee/voix_struct_probe.js
      - name: Moteur correcteur AUTONOME (bake — HTML non requis au runtime)
        run: |
          node dictee/build_correcteur.js /tmp/correcteur.standalone.js
          node -e "const C=require('/tmp/correcteur.standalone.js');C.init().then(function(){var f=C.correct('une grosse fote');if(!f.find(function(x){return x.word==='fote'&&x.sugg==='faute';}))throw new Error('bake KO');if(C.correct('Le chat mange une pomme.').length)throw new Error('bake FP');console.log('bake OK');});"
      - name: Smoke anti-régression du MOTEUR (cognition cheat-free + NEO, seedé) — AUDIT_COMPLET CI1
        run: node evo/ci_smoke.js
      - name: OMEGA·KEY — crypto (entropie passphrases + gel des listes + KAT Double Ratchet)
        run: node omega-key/test_crypto.js
      - name: Scrabidon — moteur plateau (mots croisés sur le bon axe, CHATS proposé, bi-mots scorés)
        run: node dictee/scrabidon_probe.js
      - name: EN Phase 2 — speller anglais (recall CASES + FP=0 sur casse)
        run: python3 dictee/speller_en_probe.py --check
      - name: EN Phase 2 — canal homophone anglais (recall CASES 14/14, RED = vraies fautes)
        run: python3 dictee/homophone_en_probe.py --check
      - name: EN Phase 2 — moteur JS correcteur (parité CASES avec les probes Python)
        run: node dictee/corrector_en.js --check
      # Une règle non branchée dans la page vaut ZÉRO : le 2026-08-09, 8 règles anglaises mesurées
      # et livrées n'étaient appelées par aucune page. Ce check ferme la classe de bug, et vérifie
      # au passage que la page découpe les mots avec le MÊME motif que le moteur (sinon les masques
      # renvoient des indices qui désignent d'autres mots — silencieusement).
      - name: EN — les règles du moteur sont branchées dans la page (+ tokeniseur identique)
        run: node dictee/en_page_wiring_probe.js
      # Même bug de fond, un cran plus haut : le 2026-08-09, 5 pages du site ANGLAIS n'étaient
      # reliées à rien depuis l'accueil (7/12 atteignables contre 16/17 en français), dont
      # « Privacy » et « Data » — les pages qui attestent la promesse « nothing is sent ».
      - name: SITE — toutes les pages sont atteignables depuis leur accueil (FR + EN)
        run: node dictee/pages_atteignables_probe.js
      # Né d'un échec RÉEL : Search Console « Page avec redirection », validation lancée le 13/08/2026
      # et ÉCHOUÉE le 15/08. Quatre pages étaient liées depuis le menu mais ABSENTES du sitemap, et
      # rien ne le disait. Symétrique : une page « noindex » déclarée au sitemap est un signal
      # CONTRADICTOIRE, que Google arbitre contre nous.
      - name: SITE — le sitemap déclare exactement les pages indexables
        run: node dictee/sitemap_probe.js
      # Le moteur de calcul vit en DEUX copies : `extension/calc_dys.js` (l'outil rapide) et
      # `calc_dys.js` à la racine (la page /calcul, qui montre comment on pose l'opération). Un
      # fichier recopié sans garde est exactement ce qui a coûté 134 diagnostics le 2026-08-25.
      # La sonde compare les octets ET interroge le moteur : une copie fidèle d'un moteur cassé
      # reste cassée.
      - name: moteur de calcul — 2 copies + poses + refus + câblage de la page
        run: node dictee/calc_dys_probe.js
      # Les chiffres de mesure affichés (« FP=0 sur 14 450 phrases ») sont écrits à la main dans
      # plusieurs pages. Le registre unique (metriques_probe) rend la dérive IMPOSSIBLE : un chiffre
      # nouveau ou modifié hors registre = rouge — la propagation devient structurelle.
      - name: SITE — chiffres de mesure affichés = registre unique (anti-dérive)
        run: node dictee/metriques_probe.js
      # Né d'un défaut RÉEL (24/08/2026) : `icon.svg` dessinait l'oméga avec une balise texte.
      # Un rasteriseur sans moteur de polices — celui de Google — rendait le fond et jetait le
      # glyphe : « un cercle tout noir » dans les résultats. Et `apple-touch-icon.png` était un
      # carré noir UNI (618 o, 4 couleurs), en ligne depuis des mois, jamais ouvert par personne.
      - name: SITE — les icônes montrent quelque chose (glyphe tracé, pas de police requise)
        run: python3 dictee/icones_probe.py
      # Un cran plus loin dans la même famille (échec muet → #455 micro, #456 actifs) : les boutons
      # « Copier » ne se contentaient pas d'être muets, ils AFFIRMAIENT le succès. `writeText` rend
      # une PROMESSE : le try/catch synchrone n'attrapait que l'absence d'API, jamais un refus du
      # navigateur, et « ✓ Copié » était posé inconditionnellement — sur OMEGA·KEY, une passphrase
      # ou un message chiffré qu'on croyait tenir.
      - name: UI — aucune copie n'annonce un succès qu'elle ignore (presse-papier)
        run: node dictee/presse_papier_probe.js
      # Le Chrome Web Store REFUSE un paquet sans icône 16/32/48/128 ; elles sont DÉRIVÉES de icon-512.png
      # (la marque du site) et non dessinées à part — donc gardables : une icône du site qui change sans
      # régénération laisserait l'extension avec l'ancien logo.
      - name: LIVRAISON — les icônes de l'extension sont FRAÎCHES (== icon-512.png)
        run: python3 extension/build_icons.py --check
      # Même famille, côté SITE : `icon-192.png` (icône d'installation PWA du manifest) est resté un
      # aplat 99,7 % #0d1117 pendant deux mois — #585 avait régénéré apple-touch à la main mais pas lui,
      # et la sonde d'effet ne le couvrait pas. Les deux sont désormais DÉRIVÉS de icon-512.png par un
      # build déterministe (mêmes fonctions que celui de l'extension) : la marque change ⇒ ils suivent.
      - name: LIVRAISON — les icônes du site sont FRAÎCHES (apple-touch + icon-192 == icon-512.png)
        run: python3 build_site_icons.py --check
      - name: LIVRAISON — le zip extension téléchargeable est FRAIS (octets == sources, après build_assets)
        run: python3 extension/build_zip.py --check
      - name: LIVRAISON — le pack de polices OMEGA Dys téléchargeable est FRAIS (octets == police/)
        run: python3 police/build_pack.py --check
      - name: Complément Word — planificateur police de son (g2p réel, texte JAMAIS altéré, glue Office simulée)
        run: node word/test_son_word.js
      # Même famille que le zip rassis, découverte le 2026-08-10 : `app/omega-pendu-en.html` est
      # GÉNÉRÉ depuis le monolithe français, mais rien ne vérifiait qu'il suivait. Il avait plusieurs
      # PR de retard — table de genre `_GCOLL` et graine `OMEGA_GDET` (#453), modèle de ponctuation,
      # `_npSubject`, `_quiRelAvant`, `_isPplWideEr` — donc l'application ANGLAISE tournait sur un
      # moteur plus ancien que le français, en silence.
      - name: LIVRAISON — le clone anglais est FRAIS (app EN == build(app FR))
        run: python3 dictee/build_pendu_en.py --check
      # La table des prénoms vit en 3 copies (TSV Python, blob prenoms-gz de l'app, asset de
      # l'extension). Trois moteurs, une seule donnée : une divergence ferait diverger l'accord.
      # ⚠️ On ne vérifie PAS `build_prenoms.py --check` ici : son dump source est dans data_local/,
      # gitignoré donc absent du runner — le piège payé avec lex4_en.b64 (#458).
      - name: DONNÉES — table des prénoms identique dans les 3 moteurs
        run: python3 dictee/prenoms_probe.py
      - name: LIVRAISON — service worker (syntaxe, précache liste blanche, garde anti-redirection, purge)
        run: node dictee/sw_probe.js
      - name: Docs de pilotage — CLAUDE.md dans son budget (1 500 mots, pas de ligne-fleuve) + zéro doublon DOCTRINE
        run: python3 dictee/docs_probe.py
      - name: ETAT.md frais — égal à la régénération depuis les 3 sources machine
        run: python3 dictee/etat_gen.py --check
