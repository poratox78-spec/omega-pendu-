name: CI
on: [push, pull_request]
jobs:
  dictee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Mesure du diagnostic de dictée (phrases)
        run: python3 dictee/diag_sentence.py
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Vérif syntaxe du bloc dictée intégré (app)
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('app/omega-pendu.html','utf8');const i=h.indexOf('mode PHRASES');if(i<0)throw new Error('bloc dictée introuvable');const b=h.slice(h.lastIndexOf('<script>',i)+8,h.indexOf('</script>',i));new Function(b);console.log('OK: bloc dictée se compile');"
