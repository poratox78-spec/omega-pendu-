<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plateau du pendu — bot du Déformateur de voix</title>
<!-- LE PLATEAU DU PENDU (10/10/2026) — une source « Navigateur » d'OBS, 800 × 450, fond transparent.
     Il lit le chat de la chaîne comme un spectateur ANONYME (aucun compte, aucun jeton) et redessine la partie à partir
     des messages du bot (format : pendu.js). Le dessin du pendu est celui du jeu du site (pendable.html, drawHangman).
     Adresse : pendu.html?chaine=<ta chaîne>&bot=<le compte du bot> (le dock la copie) ; ?demo=1 montre une partie
     d'exemple ; ?irc=ws://… (les sondes) remplace le serveur de chat de Twitch. -->
<link rel="stylesheet" href="pendu_plateau.css">
</head>
<body>
<div id="plateau" class="cache">
  <svg id="potence" viewBox="0 0 80 106" aria-hidden="true"></svg>
  <div id="droite">
    <div id="titre">🎯 Pendu · tape une lettre !</div>
    <div id="mot"></div>
    <div id="erreurs"></div>
    <div id="ratees"></div>
    <div id="dernier"></div>
    <div id="fin"></div>
  </div>
</div>
<div id="aide">Ouvre cette page depuis le dock du bot : « 📋 Copier l'adresse du plateau ».</div>
<script src="pendu.js"></script>
<script src="pendu_plateau.js"></script>
</body>
</html>
