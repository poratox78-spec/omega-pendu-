;(function(){
  // Auto-restart — combinaison state==='end' + label check + cooldown timestamp
  let _lastRestart=0, _restarting=false

  function _isEnd(sim){return !!(sim&&sim.state==='end')}

  function _labelEnd(id){
    const el=document.getElementById(id)
    return !!(el&&!el.textContent.includes('COMBAT IN PROGRESS'))
  }

  function _done(){
    const aEnd=_isEnd(window.simA)||_labelEnd('msA')
    const bEnd=!window.COMPARE||_isEnd(window.simB)||_labelEnd('msB')
    return aEnd&&bEnd
  }

  function _tryRestart(){
    if(_restarting)return
    if(!_done())return
    const now=Date.now()
    if(now-_lastRestart<2500)return  // cooldown anti-boucle
    _restarting=true
    setTimeout(()=>{
      if(window.SV&&SV.active)SV._randomizeConfig()
      document.getElementById('btnNewSeed')?.click()
      _lastRestart=Date.now()
      setTimeout(()=>{_restarting=false},1500)
    },1200)
  }

  // Polling permanent (jamais clearInterval)
  setInterval(_tryRestart,400)

  // Fallback RAF — jamais throttlé sur Android même en arrière-plan
  let _rafLast=0
  function _raf(ts){
    if(ts-_rafLast>800){_rafLast=ts;_tryRestart()}
    requestAnimationFrame(_raf)
  }
  requestAnimationFrame(_raf)
})()
;function createAdvisor(seed){
  CFG.agentsPerTeam=5; CFG.asymmetric=false; CFG.timeLimit=0; CFG.mode='elim'; CFG.mapSize='huge';
  const brain=new Sim('cvA','mmA',{a0:'a0A',a1:'a1A',ms:'msA',seedD:'seedDA',jamL:'jamLA',nightL:'nightLA',scoreEl:'scoreA',kcId:'killChartA',statPfx:'statKillsA'});
  brain.reset(seed||((Math.random()*1e6)|0));
  const ag=brain.agents.filter(a=>a.rn!=='DRONE');
  return {
    MW:brain.MW, MH:brain.MH, roster:ag.map(a=>({team:a.team,rn:a.rn,hp:a.hp})),
    advise(arena,units,mobs){
      const MW=brain.MW,MH=brain.MH;
      for(let y=0;y<MH;y++)for(let x=0;x<MW;x++) brain.map[y][x]=arena[y*MW+x]|0;
      /* PERF: _buildCov runs once in reset(); arena static -> no per-frame BFS */
      const n=Math.min(ag.length,units.length);
      for(let k=0;k<n;k++){const a=ag[k],u=units[k]; a.x=u.x; a.y=u.y; a.hp=(u.hp>0?u.hp:-1);}
      const bx=ag.map(a=>a.x), by=ag.map(a=>a.y);
      // GAP-1: perceive creatures as dynamic threats / soft obstacles BEFORE the
      // brain ticks, so positioning/pathing/cover-scoring react to them this frame.
      brain._stampMobs(mobs);
      brain.update();
      const out=[];
      for(let k=0;k<ag.length;k++){const a=ag[k];
        // FLAT movement delta (reverted from toroidal): raw displacement this tick.
        const dx=a.x-bx[k],dy=a.y-by[k],d=Math.hypot(dx,dy);
        let fire=false,aim=a.dir||0;
        for(const b of brain.bullets){if(b&&b._shooterId===a.uid&&(b.age||0)<=1){fire=true;aim=Math.atan2(b.vy||0,b.vx||0);break;}}
        out.push({state:a.state,dx:d>0.001?dx/d:0,dy:d>0.001?dy/d:0,aim,fire,alive:a.hp>0});
      }
      return out;
    }
  };
}
return { createAdvisor, Sim, NN };

<script>
'use strict';
// ===== VIVARIUM — SIMULATION PURE (engine-agnostic, testable headless) =====
// Aucune dépendance DOM/canvas. Le rendu (LittleJS) lit S.* et S.fx ; l'input est injecté.
// Convention : coords libres (le rendu gère l'orientation). 1 unité sim = 1 px de référence.
function createVivSim(VIV_TAC){
  const TILE=24, TEAMCOL=['#46e8ff','#ff5a3c'];
  const wrapv=(v,m)=>{v=v%m;return v<0?v+m:v;};                          // wrap dans [0,m)
  const tdel=(a,b,m)=>{let d=(b-a)%m;if(d>m/2)d-=m;else if(d<-m/2)d+=m;return d;}; // delta toroïdal (plus court)
  const WPN={ LEADER:{dmg:19,bst:2,sprd:.06,spd:9,cd:15,r:5,life:80,name:'FUSIL-A'},ASSAULT:{dmg:16,bst:3,sprd:.12,spd:9,cd:14,r:5,life:80,name:'AUTO'},FLANKER:{dmg:14,bst:2,sprd:.10,spd:9.5,cd:9,r:4,life:70,name:'SMG'},SNIPER:{dmg:46,bst:1,sprd:.02,spd:14,cd:36,r:6,life:120,type:'pierce',name:'RAILGUN'},SUPPORT:{dmg:11,bst:5,sprd:.05,spd:8.5,cd:19,r:4,life:80,type:'spread',name:'EPANDEUR'} };
  const PLWPN={dmg:20,bst:2,sprd:.05,spd:11,cd:9,r:5,life:90,name:'PLASMA'};
  const PLWPN2={dmg:9,bst:5,sprd:.11,spd:9,cd:17,r:4,life:70,type:'spread',name:'FUSIL'};
  const SEC={LEADER:{dmg:30,bst:1,sprd:.04,spd:13,cd:26,r:5,life:110,type:'pierce',name:'DMR'},ASSAULT:{dmg:9,bst:5,sprd:.12,spd:9,cd:16,r:4,life:70,type:'spread',name:'FUSIL-P'},FLANKER:{dmg:24,bst:2,sprd:.05,spd:12,cd:13,r:5,life:90,name:'SMG-LOURD'},SNIPER:{dmg:14,bst:4,sprd:.13,spd:9,cd:14,r:4,life:70,type:'spread',name:'SECONDAIRE'},SUPPORT:{dmg:18,bst:3,sprd:.10,spd:9.5,cd:15,r:4,life:80,name:'CARABINE'}};
  const NIN=16,NHID=10,WLEN=NIN*NHID+NHID*2;
  const MOBD={0:{r:10,hp:55,spd:1.5,dmg:5},1:{r:13,hp:120,spd:1.95,dmg:11},2:{r:24,hp:480,spd:1.3,dmg:26},3:{r:8,hp:35,spd:2.4,dmg:5},4:{r:18,hp:300,spd:1.05,dmg:22}};
  function randW(){const w=new Float32Array(WLEN);for(let i=0;i<WLEN;i++)w[i]=Math.random()*2-1;return w;}
  function crossW(a,b,m){m=m||.1;const c=new Float32Array(WLEN);const cut=(Math.random()*WLEN)|0;for(let i=0;i<WLEN;i++)c[i]=(i<cut?a[i]:b[i])+(Math.random()*2-1)*m;return c;}
  function recordGene(sp,brain,fit){const pool=S.genes&&S.genes[sp];if(!pool)return;pool.push({brain,fit});pool.sort((a,b)=>b.fit-a.fit);if(pool.length>12)pool.length=12;}
  function breed(sp){const pool=S.genes&&S.genes[sp];if(pool&&pool.length>=2&&Math.random()<0.7){const a=pool[(Math.random()*Math.min(5,pool.length))|0].brain,b=pool[(Math.random()*Math.min(5,pool.length))|0].brain;return crossW(a,b);}return randW();}
  function runBrain(inp,w){const h=new Float32Array(NHID);let k=0;for(let i=0;i<NHID;i++){let s=0;for(let j=0;j<NIN;j++)s+=inp[j]*w[k++];h[i]=Math.tanh(s);}let ox=0,oy=0;for(let i=0;i<NHID;i++){ox+=h[i]*w[k++];oy+=h[i]*w[k++];}return[Math.tanh(ox),Math.tanh(oy)];}

  const S={ TILE,TEAMCOL,state:'title',mission:1,runMissions:0,buffHp:0,objType:'elim',capture:0,
    MW:0,MH:0,arena:null,zone:null, units:[],mobs:[],proj:[],nades:[],loot:[], playerU:null,
    banner:'',bannerT:0, fx:[], nadeCD:0 };
  // [STA] tous les nombres réglables (le config panel écrira ici ; WPN/PLWPN/MOBD partagés par référence)
  S.wrapv=wrapv; S.tdel=tdel;
  S.cfg={ wpn:WPN, player:PLWPN, mob:MOBD,
    unitHp:200, enemyHpStep:6, allyBuff:20, playerSpeed:3.4, unitSpeed:2.7,
    gren:{cd:200,r:100,dmg:80}, zone:{r:140,cap:.5}, spawn:{g:24,h:13,apexFrom:2}, shield:60, shRegen:1.2, shDelay:120 };
  S.pwi=0; S.playerWpns=[PLWPN,PLWPN2]; S.heat=0; S.wmTick=0; S.playerRole='LEADER';
  let advisor=null,intents=null,adviseTick=0,extractT=0;

  function buildArena(){
    let seed=S.mission*9301+49297; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
    const MW=S.MW,MH=S.MH,a=S.arena;
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)a[y*MW+x]=(x===0||y===0||x>=MW-1||y>=MH-1)?1:0;
    const nW=(MW*MH*0.03)|0; for(let i=0;i<nW;i++){const x=2+((rnd()*(MW-4))|0),y=2+((rnd()*(MH-4))|0);a[y*MW+x]=1;if(rnd()<.5)a[y*MW+Math.min(MW-2,x+1)]=1;}
    for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){if(a[y*MW+x]!==0)continue;if(a[y*MW+x+1]===1||a[y*MW+x-1]===1||a[(y+1)*MW+x]===1||a[(y-1)*MW+x]===1){if(rnd()<.45)a[y*MW+x]=2;}}

    for(let cj=0;cj<gy;cj++)for(let ci=0;ci<gx;ci++){const bb=cellBiome[cj*gx+ci],wp=bb===2?.35:bb===3?.62:.45;

  function terrainAt(px,py){const tx=(px/TILE)|0,ty=(py/TILE)|0;if(tx<0||ty<0||tx>=S.MW||ty>=S.MH)return 5;return S.world?S.world.terrain[ty*S.MW+tx]:0;}

function tpts(local,x,y,ang,sc){ const c=Math.cos(ang),s=Math.sin(ang),o=[]; for(let i=0;i<local.length;i+=2){ const lx=local[i]*sc,ly=local[i+1]*sc; o.push(vec2(x+lx*c-ly*s, y+lx*s+ly*c)); } return o; }
function circlePts(cx,cy,r,n){ const o=[]; n=n||20; for(let i=0;i<n;i++){const a=i/n*6.2832;o.push(vec2(cx+Math.cos(a)*r,cy+Math.sin(a)*r));} return o; }
function starPts(cx,cy,r,spikes){ const o=[]; for(let i=0;i<spikes*2;i++){const a=i/(spikes*2)*6.2832,rr=(i%2===0)?r:r*.6;o.push(vec2(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr));} return o; }

    }catch(e){} }

      if(f.t==='muzzle'){ if(_mz<2&&sndShot){sndShot.play(vec2(f.x,f.y),.3);_mz++;} }

  if(keyIsDown('KeyA')||keyIsDown('KeyQ')||keyIsDown('ArrowLeft'))mvx--;
  if(keyIsDown('KeyD')||keyIsDown('ArrowRight'))mvx++;
  const inp={ move:{x:mvx,y:mvy}, aim:{x:mousePos.x,y:mousePos.y}, fire:mouseIsDown(0),
    grenade:keyWasPressed('KeyG'), switchWeapon:keyWasPressed('KeyF'), ability:keyWasPressed('KeyE'), deploy:(mouseWasPressed(0)||keyWasPressed('Enter')||keyWasPressed('Space')) };

function gameRenderPost(){
  if(!S)return; const ms=mainCanvasSize;
  if(S.state==='title'||(S.state==='runover')){ drawTextScreen('VIVARIUM',vec2(ms.x/2,ms.y/2-50),46,C('#fff'),5,C('#000')); drawTextScreen('Escouade vivante · monde hostile',vec2(ms.x/2,ms.y/2),16,C('#fff'),3,C('#000')); drawTextScreen(S.state==='runover'?('RUN TERMINÉE — '+S.runMissions+' mission(s)'):'',vec2(ms.x/2,ms.y/2-86),18,C('#fff'),3,C('#000')); drawTextScreen('[Entrée] / [clic] : déployer',vec2(ms.x/2,ms.y/2+40),18,C('#fff'),3,C('#000')); drawTextScreen(touchDev?'MOBILE : sticks · 2×tap droite=grenade · 2×tap gauche=arme · bouton CAP=capacité':'ZQSD · souris · clic tir · G grenade · F arme · E capacité',vec2(ms.x/2,ms.y/2+70),13,C('#fff'),3,C('#000')); return; }
  // HUD escouade — minimaliste : icône rôle + barre PV (symboles, pas de texte)
  const blues=S.units.filter(u=>u.team===0); const PX=12, bw=72; let y=14;
  drawRect(vec2(PX+52,14+blues.length*11+4),vec2(120,18+blues.length*22),C('#0a0e14',.42),0,1,true);
  drawTextScreen('◆ '+S.mission+'   ⚑ '+(S.wins||0)+'   ✖ '+(S.losses||0),vec2(PX,y),13,C('#fff'),3,C('#000'),'left'); y+=16;
  for(const u of blues){ const me=(u===S.playerU);
    if(SPR){ drawTile(vec2(PX+9,y+7),vec2(18,18),SPR[u.rn]||SPR.ASSAULT,u.hp>0?WHITE:C('#666'),0,false,undefined,undefined,true); }
    const hpf=Math.max(0,u.hp/u.maxHp);
    drawRect(vec2(PX+24+bw/2,y+5),vec2(bw,8),C('#000',.55),0,1,true);
    if(hpf>0)drawRect(vec2(PX+24+(bw*hpf)/2,y+5),vec2(bw*hpf,8),u.down?C('#d2a83a'):(hpf>.3?C('#3fcf5a'):C('#df7a33')),0,1,true);
    if(u.shMax>0&&u.sh>0){const sf=u.sh/u.shMax;drawRect(vec2(PX+24+(bw*sf)/2,y+11),vec2(bw*sf,2),C('#7fe0ff'),0,1,true);}
    if(me)drawTextScreen('▸',vec2(PX+20,y+4),12,C('#fff'),3,C('#000'),'left');
    y+=22;
  }
  // minimap
  const mmS=120/Math.max(S.MW,S.MH),mx=ms.x-S.MW*mmS-12,my=12; drawRect(vec2(mx+S.MW*mmS/2,my+S.MH*mmS/2),vec2(S.MW*mmS+6,S.MH*mmS+6),C('#000',.5),0,1,true);
  for(const u of S.units){if(u.hp<=0)continue;drawRect(vec2(mx+(u.x/S.TILE)*mmS,my+(u.y/S.TILE)*mmS),vec2(3,3),C(S.TEAMCOL[u.team]),0,1,true);}
  for(const o of S.mobs){drawRect(vec2(mx+(o.x/S.TILE)*mmS,my+(o.y/S.TILE)*mmS),vec2(2,2),o.sp===2?C('#b3f'):o.sp===4?C('#a5a'):o.sp===1?C('#e83'):o.sp===3?C('#e0a040'):C('#9d6'),0,1,true);}
  if(S.bannerT>0&&S.banner) drawTextScreen(S.banner,vec2(ms.x/2,58),20,C('#fff'),4,C('#000'));
  if(S.world&&S.playerU){const hb=Math.round(S.heat*10);let g='';for(let i=0;i<10;i++)g+=(i<hb?'▮':'▯');drawTextScreen('☠ '+g,vec2(ms.x/2,ms.y-18),13,S.heat>.6?C('#ff9a7a'):C('#fff'),3,C('#000'));}
  drawTextScreen('▸ '+(S.playerWpns?S.playerWpns[S.pwi].name:''),vec2(12,ms.y-16),13,C('#fff'),3,C('#000'),'left');
  if(touchDev){ drawPad(tMove,'#46e8ff'); drawPad(tAim,'#ff5a3c'); const ab=abilityBtn(); drawRect(vec2(ab.x,ab.y),vec2(ab.r*2,ab.r*2),C('#2a8a6a',.4),0,1,true); drawTextScreen('CAP',vec2(ab.x,ab.y),18,C('#fff'),3,C('#000')); }
}
engineInit(gameInit, gameUpdate, ()=>{}, gameRender, gameRenderPost, [VIVSHEET,LASB,LASR,BOLT,TOWN]);
})();

</script>
