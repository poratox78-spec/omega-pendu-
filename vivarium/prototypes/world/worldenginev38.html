          ctx.strokeStyle='rgba(255,170,0,0.70)';
          ctx.lineWidth=0.8;
          ctx.beginPath(); ctx.moveTo(px-sz-3,py); ctx.lineTo(px+sz+3,py); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(px,py-sz-3); ctx.lineTo(px,py+sz+3); ctx.stroke();
        }
        ctx.fillStyle='rgba(255,255,255,0.45)';
        ctx.beginPath(); ctx.arc(px,py,sz*0.20,0,Math.PI*2); ctx.fill();
        if (this.subspecies > 0) {
          ctx.fillStyle='rgba(255,255,255,0.9)';
          ctx.fillRect(px-1,py-1,2,2);
        }
      }
      ctx.globalAlpha=1;
    } else {
      // v29 : couleur Omni selon 5 modes
      const oMode = this._omniMode || 'TEND';
      const outerCol = oMode==='SCAVENGE' ? '#aa8833'
                     : oMode==='GUARD'    ? '#00eebb'
                     : oMode==='DRAIN'    ? '#4488ff'
                     : oMode==='CULL'     ? '#ff5500'
                     : oMode==='CRISIS'   ? '#ffffff'   // blanc vif
                     :                     '#44cc66';
      // halo de mode
      ctx.globalAlpha = 0.18;
      ctx.fillStyle   = outerCol;
      ctx.beginPath();
      ctx.arc(px,py,sz+4.5,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle   = col;
      ctx.beginPath();
      ctx.arc(px,py,Math.max(1.5,sz-0.5),0,Math.PI*2);
      ctx.fill();
      // anneau de mode
      ctx.strokeStyle = outerCol;
      ctx.lineWidth   = 1.2;
      ctx.beginPath();
      ctx.arc(px,py,Math.max(1.5,sz-0.5),0,Math.PI*2);
      ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.arc(px,py,Math.max(0.5,sz*0.32),0,Math.PI*2);
      ctx.fill();
      // v32 : CRISIS — double anneau pulsant blanc/rouge
      if (oMode === 'CRISIS') {
        const pulse3 = 0.5 + 0.5*Math.sin(Date.now()*0.022 + this.lineage*0.7);
        ctx.globalAlpha = 0.55 * pulse3;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(px,py,sz+8,0,Math.PI*2); ctx.stroke();
        ctx.strokeStyle = '#ff3300';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(px,py,sz+11,0,Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      // v38 : SEIGNEUR — couronne dorée + halo de domaine
      if (this.isLord) {
        const presRatio = this.lordPrestige / 100;
        const lordPulse = 0.55 + 0.35*Math.sin(Date.now()*0.008 + this.lineage*0.4);
        // Halo de domaine (très subtil — rayon scaled down pour lisibilité)
        ctx.globalAlpha = 0.06 * lordPulse;
        ctx.fillStyle   = '#ffd700';
        ctx.beginPath(); ctx.arc(px, py, LORD_DOMAIN * 0.35, 0, Math.PI*2); ctx.fill();
        // Anneau de prestige
        ctx.globalAlpha = (0.55 + presRatio*0.35) * lordPulse;
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth   = 1.8;
        ctx.beginPath(); ctx.arc(px, py, sz+9, 0, Math.PI*2); ctx.stroke();
        // Double anneau extérieur
        ctx.globalAlpha = 0.30 * lordPulse;
        ctx.strokeStyle = '#ffaa00';
        ctx.lineWidth   = 0.8;
        ctx.beginPath(); ctx.arc(px, py, sz+13, 0, Math.PI*2); ctx.stroke();
        // Couronne : 3 petits picots au-dessus
        ctx.globalAlpha = 0.90;
        ctx.fillStyle   = '#ffd700';
        const crownY = py - sz - 6;
        ctx.fillRect(px-4, crownY-1, 2, 4);   // pic gauche
        ctx.fillRect(px-1, crownY-3, 2, 6);   // pic central (plus haut)
        ctx.fillRect(px+2, crownY-1, 2, 4);   // pic droit
        ctx.fillRect(px-4, crownY+2, 8, 2);   // base couronne
        // Vassaux : ligne fine vers seigneur si vassal
        ctx.globalAlpha = 1;
      }
      // v38 : VASSAL — ligne fine vers son seigneur
      if (this.lordOf && !this.isLord) {
        const lord = this.lordOf;
        let ldx = lord.x - px; if(ldx>W*0.5)ldx-=W; if(ldx<-W*0.5)ldx+=W;
        const ldy = lord.y - py;
        const ldist = Math.sqrt(ldx*ldx+ldy*ldy);
        if (ldist > 20 && ldist < LORD_DOMAIN * 0.8) {
          ctx.globalAlpha = 0.12;
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth   = 0.5;
          ctx.beginPath(); ctx.moveTo(px, py);
          ctx.lineTo(px + ldx*0.6, py + ldy*0.6); // ne va pas jusqu'au bout
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      // v35 : outil actif — anneau doré
      if (this.tool) {
        const toolLife = this.tool.life / 600;
        ctx.globalAlpha = 0.5 * toolLife;
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(px,py,sz+6,0,Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      // v29 : marqueur GUARD — croix de protection
      if (oMode === 'GUARD') {
        ctx.strokeStyle = '#00eebb';
        ctx.lineWidth = 0.8;
        ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.moveTo(px-sz-2,py); ctx.lineTo(px+sz+2,py); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px,py-sz-2); ctx.lineTo(px,py+sz+2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      // v29 : marqueur SCAVENGE — point jaune central
      if (oMode === 'SCAVENGE') {
        ctx.fillStyle = '#ffcc44';
        ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.arc(px,py,1.5,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    ctx.globalAlpha=1;

    // v28 : halo épidémie — pulsation violette sur les infectés
    if (this.infected && Pathogen.active) {
      const pulse = 0.4 + 0.3*Math.sin(Date.now()*0.012 + this.lineage);
      ctx.globalAlpha = pulse * 0.55;
      ctx.fillStyle = '#cc44ff';
      ctx.beginPath();
      ctx.arc(px, py, sz+7, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // v31 : halo soif — orange clignotant si thirst > 0.65
    if (this.thirst > 0.65) {
      const pulse2 = 0.5 + 0.5*Math.sin(Date.now()*0.018 + this.lineage*0.3);
      ctx.globalAlpha = (this.thirst - 0.65) * 1.2 * pulse2;
      ctx.fillStyle = '#ff8800';
      ctx.beginPath();
      ctx.arc(px, py, sz+8, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // v35 : Herbi domestiqué — petit point blanc central
    if (this.domesticated) {
      ctx.globalAlpha = 0.70;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(px, py, 1.2, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }  // fin draw()
}

/* ══════════════════════════════════════════════
   PATHOGEN — Système épidémique v28
   Souches qui mutent, se propagent et s'éteignent
══════════════════════════════════════════════ */
const Pathogen = {
  active:      false,
  strain:      0,
  virulence:   0.3,     // dégâts par tick sur infectés
  infectivity: 0.12,    // probabilité de transmission par contact
  strainName:  '',
  timer:       0,
  cooldown:    0,
  log:         [],      // { tick, strain, peak, duration }
  _peakCount:  0,

  _names: ['ALPHA','BETA','GAMMA','DELTA','EPSILON','ZETA','ETA','THETA'],

  tick() {
    if (this.cooldown > 0) { this.cooldown--; return; }
    if (!this.active) {
      // Déclenche une épidémie ~toutes les 2000 ticks avec probabilité croissante
      if (Math.random() < 0.0003 + tick*0.00000002) {
        this.active      = true;
        this.strain++;
        this.strainName  = this._names[(this.strain-1) % this._names.length];
        this.virulence   = 0.15 + Math.random()*0.45;
        this.infectivity = 0.08 + Math.random()*0.18;
        this.timer       = 500 + (Math.random()*800)|0;
        this._peakCount  = 0;
        // Patient zéro : organisme vivant aléatoire, immunisés résistants
        const alive = organisms.filter(o=>!o.dead && o.immunity<0.5);
        if (alive.length > 0) {
          alive[(Math.random()*alive.length)|0].infected = true;
        }
      }
      return;
    }
    this.timer--;
    if (this.timer <= 0) {
      const peak = this._peakCount;
      this.log.push({ tick, strain:this.strainName, peak, duration:500+800-this.timer });
      if (this.log.length > 4) this.log.shift();
      this.active = false;
      this.cooldown = 1800 + (Math.random()*1200)|0;
      for (const o of organisms) o.infected = false;
      return;
    }
    // Propagation
    let cnt = 0;
    for (const o of organisms) {
      if (o.dead || !o.infected) continue;
      cnt++;
      for (const other of organisms) {
        if (other.dead || other.infected || other===o) continue;
        if (other.immunity > 0.4) continue;  // immunité partielle
        const dx=other.x-o.x, dy=other.y-o.y;
        if (dx*dx+dy*dy < 28*28) {
          if (Math.random() < this.infectivity * 0.08) other.infected = true;
        }
      }
    }
    if (cnt > this._peakCount) this._peakCount = cnt;
    // Extinction naturelle si <2 infectés
    if (cnt < 2 && this.timer > 80) this.timer = Math.min(this.timer, 80);
    // Marquage phéromone sur les cellules infectées (signal visuel)
  },

  label() {
    if (!this.active) return null;
    const cnt = organisms.filter(o=>!o.dead&&o.infected).length;
    return `☣ PATHOGEN-${this.strainName} ×${cnt} [v:${this.virulence.toFixed(2)}]`;
  },
  color() { return '#cc44ff'; },
};

/* ══════════════════════════════════════════════
   ÉCOLOGIE
══════════════════════════════════════════════ */
function updateEcology() {
  Climate.tick();
  Season.step();
  SeasonParticles.tick();

  const solar = 0.00085 * Climate.solar() * Season.solarMod() * WorldMind.policy.solarBoost;

  // v31 : diffusion eau (toutes les 6 ticks pour perf)
  const diffuseWater = (tick % 6 === 0);

  for (let x=0;x<GRID;x++) {
    for (let y=0;y<GRID;y++) {
      const c = world[x][y];

      // ── Biomasse ──────────────────────────────────────────
      const eff = c.fertility * (1 - c.stress*0.45);
      // v31 : biomasse bonus si sol humide
      const moistBonus = c.moisture > 0.5 ? (c.moisture - 0.5) * 0.35 : 0;
      c.biomass = Math.min(1, c.biomass + solar*eff*(2.2 + moistBonus));

      c.fertility = Math.min(1, c.fertility + c.history*0.00004);

      // ── Stress climatique ──────────────────────────────────
      if (Climate.state==='drought') {
        c.fertility = Math.max(0.05, c.fertility*0.99935);
        c.stress    = Math.min(1,    c.stress   +0.0018);
      } else if (Climate.state==='rain') {
        c.fertility = Math.min(1, c.fertility+0.00035);
        c.stress    = Math.max(0, c.stress   *0.9960);
      } else {
        c.stress    = Math.max(0, c.stress   *0.9985);
      }

      if (Season.current==='winter') {
        c.stress = Math.min(1, c.stress+0.00055);
      } else if (Season.current==='spring') {
        c.stress = Math.max(0, c.stress*0.9978);
      }

      // ── Cycle de l'eau v31 ────────────────────────────────
      if (c.waterBody) {
        // Source permanente : se régénère lentement
        c.moisture = Math.min(1, c.moisture + 0.0022);
      } else {
        // Évaporation naturelle
        const evap = Season.current==='summer' ? 0.00055
                   : Season.current==='winter' ? 0.00012  // gel ralentit
                   :                             0.00030;
        c.moisture = Math.max(0, c.moisture - evap);
      }

      // Pluie : recharge toutes les cellules
      if (Climate.state==='rain') {
        c.moisture = Math.min(1, c.moisture + 0.0018);
      }
      // Sécheresse : accélère l'évaporation
      if (Climate.state==='drought') {
        c.moisture = Math.max(0, c.moisture - 0.00045);
      }
      // Printemps : fonte des neiges (bonus)
      if (Season.current==='spring') {
        c.moisture = Math.min(1, c.moisture + 0.00025);
      }
      // Hiver : eau gelée = moins disponible pour boire (mais pas perdue)
      // → géré dans step() via facteur de disponibilité

      // Diffusion lente vers cellules voisines sèches
      if (diffuseWater && c.moisture > 0.35) {
        const flow = c.moisture * 0.012;
        for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++) {
          if (dx===0&&dy===0) continue;
          const nx=x+dx, ny=y+dy;
          if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID) {
            const nb = world[nx][ny];
            if (nb.moisture < c.moisture - 0.08) {
              const transfer = Math.min(flow, (c.moisture-nb.moisture)*0.05);
              nb.moisture = Math.min(1, nb.moisture + transfer);
              if (!c.waterBody) c.moisture -= transfer;
            }
          }
        }
      }

      // Fertilité bonus si sol humide
      if (c.moisture > 0.45 && !c.waterBody) {
        c.fertility = Math.min(1, c.fertility + c.moisture * 0.000055);
      }

      // ── Territoire / phéromones ────────────────────────────
      // v35 : effet habitat Omni
      if (c.habitat > 0) {
        c.stress    = Math.max(0, c.stress    - c.habitat * 0.00035);
        c.fertility = Math.min(1, c.fertility + c.habitat * 0.00015);
        c.moisture  = Math.min(1, c.moisture  + c.habitat * 0.00010);
        c.habitat  *= 0.9995;  // décroissance lente
        if (c.habitat < 0.01) c.habitat = 0;
      }

      c.terrClaim *= 0.9932;
      if (c.terrClaim<0.01) { c.terrOwner=-1; c.terrSid=-1; }

      c.phero[0] *= 0.970;
      c.phero[1] *= 0.978;
      c.phero[2] *= 0.975;
    }
  }
}

const HIST  = 310;
const phist = [[],[],[]];
let   tick  = 0;

// v33 : camps Omni — bases territoriales persistantes
// { x, y, life, strength }
const omniCamps = [];
const CAMP_RADIUS   = 130;  // rayon d'effet
const CAMP_LIFESPAN = 3000; // ticks

function updateOmniCamps() {
  // Décroissance et nettoyage
  for (let i=omniCamps.length-1; i>=0; i--) {
    omniCamps[i].life--;
    if (omniCamps[i].life <= 0) omniCamps.splice(i,1);
  }
}

/* ══════════════════════════════════════════════
   SEIGNEURS OMNI v38 — Hiérarchie féodale
   ─────────────────────────────────────────────
   Un Omni devient Seigneur si :
     • hasTool === true
     • energy > 13, age > 1800, signal > 0.6
     • Aucun autre Seigneur dans son domaine (180px)
   Le Seigneur :
     • Gagne du prestige via kills Carni + vassaux + survie
     • Draine légèrement l'énergie des vassaux proches (tribut)
     • Reçoit un bonus de métabolisme et un cap énergie étendu
     • Booste learning/signal/defense de ses vassaux (aura)
   Un vassal :
     • Pointe vers son suzerain (lordOf)
     • Reçoit aura : +energy, +defenseBonus, +reproBoost
     • En CRISIS/GUARD : converge vers le Seigneur
   Succession :
     • À la mort d'un Seigneur, le vassal le plus fort hérite
     • lordPrestige partiellement hérité
══════════════════════════════════════════════ */
const LORD_DOMAIN     = 180;  // rayon d'influence
const LORD_DOMAIN2    = LORD_DOMAIN * LORD_DOMAIN;
const LORD_ENERGY_CAP = 24;   // énergie max d'un Seigneur
const LORD_PRESTIGE_MAX = 100;

function updateLords() {
  if (!organisms || organisms.length === 0) return;

  const omnis = [];
  for (const o of organisms) {
    if (!o.dead && o.sid === 2) omnis.push(o);
  }
  if (omnis.length === 0) return;

  // ── 1. Promotion : peut-on devenir Seigneur ? ──────────────
  for (const o of omnis) {
    if (o.isLord) continue;
    if (!o.hasTool) continue;
    if (o.energy < 13 || o.age < 1800 || o.signal < 0.6) continue;

    // Vérifie qu'aucun seigneur existant n'est dans le domaine
    let lordNear = false;
    for (const other of omnis) {
      if (!other.isLord || other === o) continue;
      let dx = other.x - o.x; if(dx>W*0.5)dx-=W; if(dx<-W*0.5)dx+=W;
      const dy = deltaY(o.y, other.y);
      if (dx*dx + dy*dy < LORD_DOMAIN2) { lordNear = true; break; }
    }
    if (!lordNear) {
      o.isLord       = true;
      o.lordPrestige = Math.min(LORD_PRESTIGE_MAX, o.age * 0.008 + o.energy * 1.5);
    }
  }

  // ── 2. Déchéance du Seigneur ──────────────────────────────
  for (const o of omnis) {
    if (!o.isLord) continue;
    // Perd le titre si trop faible ou isolé
    let vassalCount = 0;
    for (const v of omnis) {
      if (v === o || !v.lordOf || v.lordOf !== o) continue;
      vassalCount++;
    }
    if (o.energy < 5 || (vassalCount === 0 && o.lordPrestige < 20)) {
      // Succession : le vassal le plus fort hérite
      let heir = null, heirEnergy = 0;
      for (const v of omnis) {
        if (v.lordOf === o && v.hasTool && v.energy > heirEnergy) {
          heirEnergy = v.energy; heir = v;
        }
      }
      if (heir) {
        heir.isLord       = true;
        heir.lordPrestige = o.lordPrestige * 0.55; // héritage partiel
        heir.lordOf       = null;
      }
      o.isLord       = false;
      o.lordPrestige = 0;
    }
  }

  // ── 3. Assignation vassaux ────────────────────────────────
  // Chaque Omni se lie au Seigneur le plus proche dans son domaine
  for (const o of omnis) {
    if (o.isLord) { o.lordOf = null; continue; }
    let bestLord = null, bestDist = LORD_DOMAIN2;
    for (const lord of omnis) {
      if (!lord.isLord) continue;
      let dx = lord.x - o.x; if(dx>W*0.5)dx-=W; if(dx<-W*0.5)dx+=W;
      const dy = deltaY(o.y, lord.y);
      const d2 = dx*dx + dy*dy;
      if (d2 < bestDist) { bestDist = d2; bestLord = lord; }
    }
    o.lordOf = bestLord;
  }

  // ── 4. Effets par Seigneur ────────────────────────────────
  for (const lord of omnis) {
    if (!lord.isLord) continue;

    let vassalCount = 0;
    let nearCarni   = null, nearCarniDist = 1e9;

    for (const o of omnis) {
      if (o.lordOf !== lord) continue;
      vassalCount++;

      // ── AURA sur les vassaux ─────────────────────────────
      // Bonus énergie passif
      o.energy = Math.min(18, o.energy + 0.010 + lord.lordPrestige * 0.00008);

      // Accélère l'apprentissage outil
      if (!o.hasTool) o.learning += 0.018;

      // Amplifie le signal collectif
      o.signal = Math.min(1, o.signal + 0.04);

      // Défense renforcée
      o.defenseBonus   = Math.max(o.defenseBonus || 1, 1.6);
      o.reproductionBoost = Math.max(o.reproductionBoost || 1, 2.2);

      // Tribut inverse : vassaux très riches reversent un peu
      if (o.energy > 14) {
        const tribute = Math.min(0.020, (o.energy - 14) * 0.12);
        o.energy      -= tribute;
        lord.energy   += tribute * 0.80;
      }
    }

    // Prestige évolue avec les vassaux et la durée
    lord.lordPrestige = Math.min(LORD_PRESTIGE_MAX,
      lord.lordPrestige + vassalCount * 0.003 + 0.001
    );

    // Bonus métab Seigneur (efficacité du prestige)
    const prestigeBonus = lord.lordPrestige / LORD_PRESTIGE_MAX;
    lord.energy += 0.012 + prestigeBonus * 0.018;
    lord.energy  = Math.min(LORD_ENERGY_CAP, lord.energy);

    // Scan Carni menaçant dans le domaine
    for (const o of organisms) {
      if (o.dead || o.sid !== 1) continue;
      let dx = o.x - lord.x; if(dx>W*0.5)dx-=W; if(dx<-W*0.5)dx+=W;
      const dy = deltaY(lord.y, o.y);
      const d2 = dx*dx + dy*dy;
      if (d2 < LORD_DOMAIN2 && d2 < nearCarniDist) {
        nearCarniDist = d2; nearCarni = o;
      }
    }

    // Si Carni dans le domaine : lord drains him + signal vassaux de converger
    if (nearCarni) {
      const dist = Math.sqrt(nearCarniDist);
      const dmg = dist < 30 ? 0.055 : 0.022;
      nearCarni.energy -= dmg;
      lord.energy      += dmg * 0.6;
      lord.lordPrestige = Math.min(LORD_PRESTIGE_MAX, lord.lordPrestige + 0.5);

      // Les vassaux reçoivent un signal de ralliement
      for (const o of omnis) {
        if (o.lordOf !== lord) continue;
        o._warTargetX = nearCarni.x;
        o._warTargetY = nearCarni.y;
        o._omniSpeedMult = 1.4; // rush vers la menace
      }
    }

    // Boost camp : si le seigneur est dans un camp, il le renforce
    for (const cp of omniCamps) {
      const cdx = cp.x - lord.x, cdy = cp.y - lord.y;
      if (cdx*cdx + cdy*cdy < CAMP_RADIUS*CAMP_RADIUS) {
        cp.strength = Math.min(1.5, cp.strength + 0.001 * (1 + lord.lordPrestige*0.01));
        cp.life     = Math.min(cp.life + 2, CAMP_LIFESPAN);
      }
    }
  }
}

// v34 : ZONE CENTRALE — contrôle territorial
const ZONE_CX = W / 2;
const ZONE_CY = SIM_H / 2;
const ZONE_R  = Math.min(W, SIM_H) * 0.18;
const ZONE_R2 = ZONE_R * ZONE_R;

const zoneControl = {
  counts:   [0, 0, 0],
  dominant: -1,
  pressure: 0,
  history:  [],
  bonus:    [0, 0, 0],
};

function updateZoneControl() {
  const c = [0, 0, 0];
  for (const o of organisms) {
    if (o.dead) continue;
    const dx = o.x - ZONE_CX, dy = o.y - ZONE_CY;
    if (dx*dx + dy*dy < ZONE_R2) c[o.sid]++;
  }
  zoneControl.counts = c;
  const total = c[0]+c[1]+c[2];
  if (total < 3) {
    zoneControl.dominant = -1;
    zoneControl.pressure = 0;
    zoneControl.bonus    = [0, 0, 0];
  } else {
    const best = Math.max(c[0],c[1],c[2]);
    let dom = -1;
    for (let s=0;s<3;s++) if (c[s]===best) { dom=s; break; }
    const sorted = [c[0],c[1],c[2]].sort((a,b)=>b-a);
    zoneControl.pressure = Math.min(1, sorted[1] / (sorted[0]+1));
    zoneControl.dominant = dom;
    const ctrl = c[dom] / (total+1);
    zoneControl.bonus = [0, 0, 0];
    zoneControl.bonus[dom] = ctrl * 0.006;
    for (let s=0;s<3;s++) if (s!==dom) zoneControl.bonus[s] = -ctrl * 0.003;
  }
  zoneControl.history.push(zoneControl.dominant);
  if (zoneControl.history.length > 90) zoneControl.history.shift();
}


// v33 : détecte mode RAGE Carni — quand Omni > Herbi
function carniRageActive() {
  return popCache[2] > popCache[0] * 0.85 && popCache[1] > 2;
}

// v35 : stewardOmni — régulation globale par les Omni (O(n) 1× par tick)
// Remplace le patch O(n²) qui l'appelait dans chaque step individuel
function stewardOmniTick() {
  const Hp = popCache[0], Cp = popCache[1], Op = popCache[2];
  const ratioHC = Hp / (Cp + 1);
  const omniCount = Op;
  if (omniCount === 0) return;

  // 1. Trop de Herbi → Omni appauvrissent légèrement le sol autour d'eux
  if (ratioHC > 4) {
    let checked = 0;
    for (const o of organisms) {
      if (o.dead || o.sid !== 2) continue;
      const cell = cellAt(o.x, o.y);
      if (cell) {
        cell.fertility = Math.max(0.05, cell.fertility * 0.9985);
        cell.biomass   = Math.max(0,    cell.biomass   * 0.9990);
      }
      if (++checked > 20) break;  // limite pour perf
    }
  }

  // 2. Carni domine → drain collectif léger (ex-patch: 0.01/step sur tous = trop fort)
  //    v36 : proportionnel au ratio, plus fort en surpopulation extrême
  if (Cp > Hp * 0.70) {
    const ratio = Cp / (Hp + 1);
    // Drain progressif : 0.004 à ratio=1.5, 0.014 à ratio=3.0, plafonné à 0.020
    const drain = Math.min(0.020, (ratio - 0.70) * 0.008);
    for (const o of organisms) {
      if (!o.dead && o.sid === 1) o.energy -= drain;
    }
  }

  // 3. Crise populationnelle → Omni régénèrent leur terrain
  if (Hp < 20 || Cp < 5) {
    let checked = 0;
    for (const o of organisms) {
      if (o.dead || o.sid !== 2) continue;
      const cell = cellAt(o.x, o.y);
      if (cell) {
        cell.stress    = Math.max(0, cell.stress    * 0.955);
        cell.moisture  = Math.min(1, cell.moisture  + 0.003);
        cell.fertility = Math.min(1, cell.fertility + 0.003);
      }
      if (++checked > 15) break;
    }
  }

  // v38 : trickle survie si Omni < 10
  if (Op < 10 && Op > 0) {
    const trickle = Math.min(0.025, (10 - Op) * 0.003);
    for (const o of organisms) {
      if (!o.dead && o.sid === 2) o.energy += trickle;
    }
  }
}

function trackPop() {
  if (tick%4!==0) return;
  const c=[0,0,0];
  for (const o of organisms) if (!o.dead) c[o.sid]++;
  for (let s=0;s<3;s++){
    phist[s].push(c[s]);
    if (phist[s].length>HIST) phist[s].shift();
    if (!isExtinct[s] && c[s]===0 && tick>80) {
      isExtinct[s]=true;
      extinctLog.push({tick,sid:s,name:SPECIES[s].name});
      if (extinctLog.length>6) extinctLog.shift();
    }
  }
}

function shannonH() {
  const cnt={}; let tot=0;
  for (const o of organisms){if(o.dead)continue;cnt[o.sid]=(cnt[o.sid]||0)+1;tot++;}
  if (!tot) return 0;
  let h=0;
  for (const k in cnt){const p=cnt[k]/tot;h-=p*Math.log(p);}
  return h;
}

function lineageCount() {
  const s=new Set();
  for (const o of organisms) if(!o.dead) s.add(o.lineage);
  return s.size;
}

function topLineages(n=7) {
  const m={};
  for (const o of organisms) {
    if (o.dead) continue;
    const k=`${o.sid}:${o.lineage}`;
    if (!m[k]) m[k]={sid:o.sid,lineage:o.lineage,count:0};
    m[k].count++;
  }
  return Object.values(m).sort((a,b)=>b.count-a.count).slice(0,n);
}

/* ══════════════════════════════════════════════
   RENDU – MONDE
══════════════════════════════════════════════ */
function drawWorld() {
  // Tinte saisonnière
  const [sr,sg,sb,sa] = Season.worldTint();

  for (let x=0;x<GRID;x++) {
    for (let y=0;y<GRID;y++) {
      const c=world[x][y];

      const g=(c.biomass*150)|0;
      const r=(c.stress*45+c.history*35)|0;
      const b=(8+c.history*8)|0;

      let fr=r, fg=Math.min(255,g+(c.history*40)|0), fb=b;

      if (c.phero[0]>0.05) fr=Math.min(255,fr+(c.phero[0]*60)|0);
      if (c.phero[1]>0.05){fr=Math.min(255,fr+(c.phero[1]*40)|0);fb=Math.max(0,fb-10);}
      // v32 : phero[2] Omni CRISIS — teinte blanche/grise
      if (c.phero[2]>0.08){
        fr=Math.min(255,(fr+c.phero[2]*30)|0);
        fg=Math.min(255,(fg+c.phero[2]*30)|0);
        fb=Math.min(255,(fb+c.phero[2]*30)|0);
      }

      if (c.terrSid>=0&&c.terrClaim>0.06) {
        const t=c.terrClaim*0.38;
        const hue=SPECIES[c.terrSid].hue;
        if(hue<60)  fr=(fr+(100-fr)*t)|0;
        else if(hue>180) fb=(fb+(115-fb)*t)|0;
        else fg=(fg+20*t)|0;
      }

      // v31 : composante bleue humidité
      const moist = c.moisture;
      if (moist > 0.35) {
        const mf = (moist - 0.35) * 1.54;  // 0→1
        if (c.waterBody && moist > 0.70) {
          // Points d'eau : bleu profond
          fr = (fr*(1-mf*0.7))|0;
          fg = (fg*(1-mf*0.5) + 12*mf)|0;
          fb = Math.min(255, (fb + mf*110))|0;
        } else {
          // Humidité : légère teinte cyan
          fb = Math.min(255, (fb + mf*38))|0;
          fg = Math.min(255, (fg + mf*12))|0;
        }
      }

      // v14 : teinte saison
      fr=Math.min(255,(fr+sr)|0);
      fg=Math.min(255,(fg+sg)|0);
      fb=Math.min(255,(fb+sb)|0);

      ctx.fillStyle=`rgb(${fr},${fg},${fb})`;
      ctx.fillRect(x*CW,y*CH,CW+0.5,CH+0.5);
    }
  }
}

function drawScanlines() {
  ctx.fillStyle='rgba(0,0,0,0.07)';
  for (let y=0;y<SIM_H;y+=3) ctx.fillRect(0,y,W,1);
}

/* ══════════════════════════════════════════════
   VISUAL FX
══════════════════════════════════════════════ */
function drawVisualFX(t) {
  const grad=ctx.createRadialGradient(W/2,SIM_H/2,SIM_H*0.2,W/2,SIM_H/2,SIM_H*0.8);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,SIM_H);
  ctx.fillStyle='rgba(20,40,80,0.05)';
  ctx.fillRect(0,0,W,SIM_H);

  // v34 : ZONE CENTRALE — anneau + remplissage selon dominant
  {
    const dom = zoneControl.dominant;
    const pres = zoneControl.pressure;
    const pulse = 0.55 + 0.30*Math.sin(t*0.0035);

    // Remplissage teinté par l'espèce dominante
    if (dom >= 0) {
      const hues = [130, 0, 210];  // Herbi/Carni/Omni
      const alpha = 0.07 + pres*0.08;
      ctx.globalAlpha = alpha * pulse;
      ctx.fillStyle = `hsl(${hues[dom]},80%,50%)`;
      ctx.beginPath();
      ctx.arc(ZONE_CX, ZONE_CY, ZONE_R, 0, Math.PI*2);
      ctx.fill();
    }

    // Anneau extérieur
    const ringAlpha = dom < 0 ? 0.10 : 0.25 + pres*0.25;
    ctx.globalAlpha = ringAlpha * pulse;
    const ringCol = dom < 0 ? '#334466' : dom===1 ? '#ff3300' : dom===2 ? '#00ddcc' : '#44ff88';
    ctx.strokeStyle = ringCol;
    ctx.lineWidth = dom < 0 ? 0.8 : 1.5 + pres;
    ctx.beginPath();
    ctx.arc(ZONE_CX, ZONE_CY, ZONE_R, 0, Math.PI*2);
    ctx.stroke();

    // Anneau intérieur (conflit intense)
    if (pres > 0.45) {
      ctx.globalAlpha = (pres - 0.45) * 0.6 * pulse;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.arc(ZONE_CX, ZONE_CY, ZONE_R * 0.65, 0, Math.PI*2);
      ctx.stroke();
    }

    // Marqueur central : croix + point
    ctx.globalAlpha = 0.35 * pulse;
    ctx.fillStyle = ringCol;
    ctx.fillRect((ZONE_CX-3)|0, (ZONE_CY-1)|0, 6, 2);
    ctx.fillRect((ZONE_CX-1)|0, (ZONE_CY-3)|0, 2, 6);

    ctx.globalAlpha = 1;
  }

  // v38 : Seigneurs Omni — domaine doré subtil
  for (const o of organisms) {
    if (o.dead || !o.isLord) continue;
    const presRatio = o.lordPrestige / 100;
    const lordPulse = 0.4 + 0.2*Math.sin(t*0.0025 + o.x*0.015);
    // Cercle de domaine
    ctx.globalAlpha = (0.06 + presRatio*0.06) * lordPulse;
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth   = 1.2;
    ctx.beginPath();
    ctx.arc(o.x|0, o.y|0, LORD_DOMAIN * 0.55, 0, Math.PI*2);
    ctx.stroke();
    // Point doré au centre du domaine
    ctx.globalAlpha = 0.45 * lordPulse;
    ctx.fillStyle = '#ffd700';
    ctx.fillRect((o.x-3)|0, (o.y-1)|0, 6, 2);
    ctx.fillRect((o.x-1)|0, (o.y-3)|0, 2, 6);
    ctx.globalAlpha = 1;
  }

  // v33 : camps Omni — cercle d'influence teal + point central
  for (const cp of omniCamps) {
    const lifeRatio = cp.life / CAMP_LIFESPAN;
    const pulse = 0.45 + 0.25*Math.sin(t*0.003 + cp.x*0.02);
    ctx.globalAlpha = lifeRatio * pulse * 0.22;
    ctx.strokeStyle = '#00ddcc';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(cp.x, cp.y, CAMP_RADIUS * 0.6, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = lifeRatio * 0.55;
    ctx.fillStyle = '#00ffdd';
    ctx.fillRect((cp.x-2)|0, (cp.y-2)|0, 4, 4);
    // Croix centrale
    ctx.strokeStyle = '#00ffdd';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(cp.x-6, cp.y); ctx.lineTo(cp.x+6, cp.y); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cp.x, cp.y-6); ctx.lineTo(cp.x, cp.y+6); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // v33 : RAGE Carni — teinte rouge atmosphérique si actif
  if (carniRageActive()) {
    const rPulse = 0.025 + 0.015*Math.sin(t*0.007);
    ctx.fillStyle = `rgba(180,0,0,${rPulse})`;
    ctx.fillRect(0, 0, W, SIM_H);
  }

  // v14 : teinte atmosphérique saisonnière
  const [sr,sg,sb,sa]=Season.worldTint();
  if (sa>0) {
    ctx.fillStyle=`rgba(${sr},${sg},${sb},${sa})`;
    ctx.fillRect(0,0,W,SIM_H);
  }
}

let globalVapor = 0.0;

// Initialisation altitude + groundwater
for(let x=0;x<GRID;x++){

function hydrospherePlanetary(){

  // ───── ATMOSPHERE ─────
  let evapTotal = 0;

  for(let x=0;x<GRID;x++){
    for(let y=0;y<GRID;y++){
      const c = world[x][y];

      // évaporation dépend altitude + saison
      const evap = c.moisture * 0.002 *
                   (Season.current==='summer'?1.4:1) *
                   (Climate.state==='drought'?1.8:1);

      c.moisture -= evap;
      evapTotal += evap;

      if(c.moisture < 0) c.moisture = 0;
    }
  }

  globalVapor += evapTotal;

  // condensation si seuil atteint
  if(globalVapor > 1.5){
    const rainCells = Math.floor(globalVapor * 30);
    for(let i=0;i<rainCells;i++){
      const rx = (Math.random()*GRID)|0;
      const ry = (Math.random()*GRID)|0;
      world[rx][ry].moisture += 0.05;
    }
    globalVapor *= 0.4;
  }

  // ───── SURFACE FLOW (gravité simplifiée) ─────
  for(let x=0;x<GRID;x++){
    for(let y=0;y<GRID;y++){
      const c = world[x][y];
      if(c.moisture < 0.6) continue;

      let lowest = c.altitude;
      let tx=x, ty=y;

      for(let dx=-1;dx<=1;dx++){
        for(let dy=-1;dy<=1;dy++){
          const nx=(x+dx+GRID)%GRID;
          const ny=(y+dy+GRID)%GRID;
          if(world[nx][ny].altitude < lowest){
            lowest = world[nx][ny].altitude;
            tx=nx; ty=ny;
          }
        }
      }

      if(tx!==x || ty!==y){
        const flow = c.moisture * 0.05;
        c.moisture -= flow;
        world[tx][ty].moisture += flow;
        world[tx][ty].river += 0.02;
      }
    }
  }

  // ───── GROUNDWATER ─────
  for(let x=0;x<GRID;x++){
    for(let y=0;y<GRID;y++){
      const c = world[x][y];

      // recharge nappe
      c.groundwater += c.moisture * 0.002;

      // nappe réalimente surface lentement
      const seep = c.groundwater * 0.0005;
      c.moisture += seep;
      c.groundwater -= seep;

      if(c.groundwater < 0) c.groundwater = 0;
      if(c.moisture > 1) c.moisture = 1;

      // biomasse boost rivière
      if(c.river > 0.05){
        c.biomass += 0.002 * c.river;
      }

      c.river *= 0.96; // dissipation visuelle
    }
  }

  // ───── IA MIGRATION EAU ─────
  for(const o of organisms){
    if(o.dead) continue;

    o.thirst += 0.002;

    const c = cellAt(o.x,o.y);
    if(c && c.moisture > 0.55){
      o.thirst -= 0.03;
      c.moisture -= 0.001;
    }

    if(o.thirst > 0.4){
      // cherche gradient eau local
      const gx=(o.x/CW)|0;
      const gy=(o.y/CH)|0;
      let best=c.moisture;
      let mx=0,my=0;

      for(let dx=-2;dx<=2;dx++){
        for(let dy=-2;dy<=2;dy++){
          const nx=(gx+dx+GRID)%GRID;
          const ny=(gy+dy+GRID)%GRID;
          if(world[nx][ny].moisture > best){
            best=world[nx][ny].moisture;
            mx=dx; my=dy;
          }
        }
      }

      o.x = (o.x + mx*1.2 + W) % W;
      o.y = wrapY(o.y + my*1.2);
    }

    if(o.thirst > 0.9){
      o.energy -= 0.008;
    }

    if(o.thirst < 0) o.thirst = 0;
  }
}

const culturalPressure = {};
const CollectiveMind = { signals:{moveX:0, moveY:0} };

function updateCollective(dx, dy){
  CollectiveMind.signals.moveX += dx*0.0001;
  CollectiveMind.signals.moveY += dy*0.0001;
}

function decayCollective(){
  CollectiveMind.signals.moveX *= 0.995;
  CollectiveMind.signals.moveY *= 0.995;
}

function socialTransmission(org){
  if(!org.abilities) return;

  for(const other of organisms){
    if(other===org || other.dead || other.sid!==org.sid) continue;

    const dx=other.x-org.x;
    const dy=other.y-org.y;
    if(dx*dx+dy*dy>70*70) continue;

    for(const key in org.abilities){
      const src=org.abilities[key];
      const tgt=other.abilities[key];

      if(!src?.active || tgt?.active) continue;

      const chance = 0.002 * (src.level||1);
      if(Math.random()<chance){
        other.abilities[key]={active:true,level:1,usage:0};
        culturalPressure[key]=(culturalPressure[key]||0)+0.01;
      }
    }
  }
}

function cultureSpread(key){
  const total=organisms.filter(o=>!o.dead).length;
  let count=0;
  for(const o of organisms){
    if(!o.dead && o.abilities && o.abilities[key]?.active) count++;
  }
  return total?count/total:0;
}

function triggerCulturalSpeciation(key){
  for(const o of organisms){
    if(o.dead||!o.abilities[key]?.active) continue;
    o.subspecies = (o.subspecies||0)+100;
  }
}

<script>
(function(){

const MUTATION_RATE = 0.06;

function randomMut(v){
  return v + v * (Math.random()*2-1) * MUTATION_RATE;
}

function createGenome(){
  return {
    speed:0.8+Math.random()*0.4,
    stamina:0.8+Math.random()*0.4,
    metabolism:0.8+Math.random()*0.4,
    size:0.8+Math.random()*0.4,
    perception:0.8+Math.random()*0.4,
    learningRate:0.8+Math.random()*0.4,
    memoryRetention:0.8+Math.random()*0.4,
    thirstSensitivity:0.8+Math.random()*0.4,
    heatTolerance:0.8+Math.random()*0.4,
    coldTolerance:0.8+Math.random()*0.4,
    fertilityBias:0.8+Math.random()*0.4,
    aggression:Math.random(),
    sociality:Math.random(),
    territoriality:Math.random()
  };
}

function inheritGenome(g1,g2){
  const g={};
  for(const k in g1){
    const avg=(g1[k]+g2[k])/2;
    g[k]=randomMut(avg);
  }
  return g;
}

// Track organisms safely without modifying class
let lastCount = 0;

function evolutionTick(){

  if(typeof organisms === "undefined") return;

  // Assign genome to any organism missing one
  for(const o of organisms){
    if(!o.genome){
      o.genome = createGenome();
    }
  }

  // Detect newborns
  if(organisms.length > lastCount){

    const newborns = organisms.slice(lastCount);

    for(const child of newborns){

      // try to find nearby parents (heuristic)
      let p1=null,p2=null;

      for(const o of organisms){
        if(o===child) continue;
        const dx=o.x-child.x;
        const dy=o.y-child.y;
        if(dx*dx+dy*dy<25){
          if(!p1) p1=o;
          else { p2=o; break; }
        }
      }

      if(p1 && p2 && p1.genome && p2.genome){
        child.genome = inheritGenome(p1.genome,p2.genome);
      }else{
        child.genome = createGenome();
      }
    }
  }

  lastCount = organisms.length;
}

// run evolution inside main loop safely
const oldLoop = window.loop;

window.loop = function(){
  evolutionTick();
  oldLoop();
};

console.log("Safe Darwin Evolution Active");

})();

  // hydric stress estimation
  let moistureSum = 0;
  let count = 0;
  for(let x=0;x<GRID;x++){
    for(let y=0;y<GRID;y++){
      moistureSum += world[x][y].moisture;
      count++;
    }
  }
  const avgMoisture = moistureSum / count;
  const hydricStress = avgMoisture < 0.35 ? (0.35 - avgMoisture) : 0;

  // stability score
  wmStability = 1 - (imbalance + hydricStress) * 0.5;
  if(wmStability < 0) wmStability = 0;

  // evolving memory (slow adaptation)
  wmMemory += (wmStability - wmMemory) * 0.02;

  // moderate influence (max 5% effect) — FIX: reduced to avoid genome drift to 0
  const influence = (1 - wmStability) * 0.05;

  // FIX: only nudge occasionally (1 in 30 ticks) to prevent accumulated drift
  if(Math.random() < 0.033){
    for(const o of organisms){
      if(!o.genome) continue;

      // FIX: additive nudge with hard clamp instead of multiplicative (avoids drift to 0)
      o.genome.aggression  = Math.max(0.05, Math.min(1.5, o.genome.aggression  - influence * 0.5));
      o.genome.sociality   = Math.max(0.05, Math.min(1.5, o.genome.sociality   + influence * 0.5));

      if(o.genome.fertilityBias)
        o.genome.fertilityBias = Math.max(0.1, Math.min(1.5, o.genome.fertilityBias - influence * 0.3));

      // FIX: learningRate clamped — was unbounded before
      if(o.genome.learningRate)
        o.genome.learningRate = Math.min(3.0, o.genome.learningRate * (1 + wmMemory * 0.01));
    }
  }
}

// integrate safely without breaking core
const oldLoopWM = window.loop;
window.loop = function(){
  worldMindTick();
  oldLoopWM();
};

console.log("World Mind active (invisible / moderate / evolving)");

})();
</script>

<!-- OMNIVORE ADAPTIVE CIVILIZATION + STRATEGIC REPRODUCTION -->
<script>
(function(){

function omniAdaptiveSystem(){

  if(typeof organisms === "undefined") return;

  const total = organisms.length;
  if(total < 5) return;

  // FIX: use o.sid (not o.type)
  let herb=0, carn=0, omni=0;
  for(const o of organisms){
    if(o.sid===0) herb++;
    else if(o.sid===1) carn++;
    else if(o.sid===2) omni++;
  }

  const carnRatio = carn / total;
  const herbRatio = herb / total;

  for(const o of organisms){

    // FIX: use o.sid
    if(o.sid !== 2) continue;

    // -------- STRATEGIC STATES --------

    const warMode      = carnRatio > 0.25 && o.energy > 1.3;
    const regulateMode = herbRatio > 0.6  && o.energy > 1.2;

        o.attackBonus  = 1.35;

    for(const other of organisms){
        if(other.sid !== 2) continue;

        if(dx*dx + dy*dy < 900) nearby++;
    }

    if(nearby >= 4 && o.energy > 1.4){

    if(omni < herb * 0.2 && Math.random() < 0.01){

<!-- WORLD MIND PHASE 2 : VILLAGE NETWORK -->
<script>
(function(){

const villages = [];

function findOrCreateVillage(o){
  // check existing villages
  for(const v of villages){
    const dx = o.x - v.x;
    const dy = o.y - v.y;
    if(dx*dx + dy*dy < 1600){ // radius ~40
      v.members.push(o);
      return v;
    }
  }
  // create new village
  const v = {x:o.x,y:o.y,members:[o],energy:0};
  villages.push(v);
  return v;
}

function updateVillages(){

  if(typeof organisms === "undefined") return;

  // FIX: villages.length=0 each tick correctly resets — village objects recreated fresh
  villages.length = 0;

  // FIX: use o.sid (not o.type)
  const omnis = organisms.filter(o => !o.dead && o.sid === 2);

  // regroup omnivores into villages
  for(const o of omnis){
    findOrCreateVillage(o);
  }

  for(const v of villages){

    if(v.members.length < 5) continue;

    // compute center
    let sx=0, sy=0;
    for(const m of v.members){ sx+=m.x; sy+=m.y; }
    v.x = sx / v.members.length;
    v.y = sy / v.members.length;

    // energy storage system
    for(const m of v.members){
      if(m.energy > 1.6){
        const surplus = (m.energy - 1.6)*0.3;
        m.energy -= surplus;
        v.energy += surplus;
      }
    }

    // distribute energy if weak members
    for(const m of v.members){
      if(m.energy < 0.9 && v.energy > 0.01){
        const share = Math.min(0.01, v.energy);
        m.energy += share;
        v.energy -= share;
      }
    }

    // defense bonus
    for(const m of v.members){
      m.defenseBonus    = 1.4;
      m.reproductionBoost = 2.0;
    }

    // village communication — FIX: removed m.vx/m.vy nudge (engine doesn't use these)
    // Instead store a migration hint that the engine brain can pick up
    for(const other of villages){
      if(other===v) continue;
      const dx = v.x - other.x;
      const dy = v.y - other.y;
      const dist = dx*dx + dy*dy;
      if(dist < 120000){
        for(const m of v.members){
          // Store inter-village pull hint (safe, read-only for main engine)
          m._villageX = other.x;
          m._villageY = other.y;
        }
      }
    }
  }
}

// integrate safely
const oldLoopWM2 = window.loop;
window.loop = function(){
  updateVillages();
  oldLoopWM2();
};

console.log("WORLD MIND PHASE 2 ACTIVE: village network online");

})();
</script>

<script>

function domesticationSystem(){

  if(typeof organisms === "undefined") return;

  const omnivores = organisms.filter(o=>!o.dead && o.sid===2);
  const herbivores = organisms.filter(o=>!o.dead && o.sid===0);

  for(const o of omnivores){

    for(const h of herbivores){

      const dx = o.x - h.x;
      const dy = o.y - h.y;
      const dist = dx*dx + dy*dy;

      // capture herbivore if close and enough energy

        h.domesticated = true;
        h.owner = o;
        o.energy -= 0.2;

      // mounted movement bonus — FIX: removed o.vx *= 1.15 (engine doesn't use vx/vy)
      // Speed boost stored as tag, actual movement is handled by brain in main engine

      // FIX: removed Object.assign({}, h) — creates a plain object without step()/draw()
      // methods, crashes the main loop. Use the main engine's Organism constructor instead.
      // Herd breeding: gentle energy bonus to owner instead
      if(h.domesticated && h.owner === o && Math.random() < 0.0005){

      }

    // ---- BOW HUNTING ----

        target.energy -= 0.02;
        o.energy      -= 0.005;
