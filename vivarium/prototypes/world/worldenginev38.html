<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>World Engine v38</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; }
canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>

<!-- WORLD ENGINE v37 - CIVILIZATION AGRARIAN (DEBUGGED)
   Fixes over v36-CIVILIZATION-AGRARIAN:
   1. o.type → o.sid  (ALL add-on scripts — was silently filtering wrong species)
   2. o.maxAge *= 1.5 every tick → REMOVED (grew to Infinity in <100 ticks)
   3. o.energy *= 1.000x every tick → replaced with rare flat bonuses (4 scripts)
   4. Object.assign({},h) as Organism newborn → REMOVED (crashes engine, no step/draw)
   5. o.vx/o.vy movement nudges → REMOVED (main engine uses mx/my, not vx/vy)
   6. o.learningRate *= 1.002 every tick → REMOVED (unbounded growth)
   7. WorldMind genome drift to 0 → clamped + moved to 1-in-30 ticks
   8. o.age double-incremented in livestock → fixed (main engine already tracks it)
   9. Energy caps unified to 15 across add-on scripts (was 3/4, engine uses ~15)
-->


<!-- ============================================ -->
<!-- WORLD ENGINE v36 - STABLE FROZEN BUILD     -->
<!-- Systems: Hydrosphere + Evolution + WorldMind -->
<!-- Mode: Equilibrium Locked / No Experimental  -->
<!-- ============================================ -->

<canvas id="c"></canvas>
<script>
'use strict';

/* ══════════════════════════════════════════════
   SETUP
══════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;

const W     = canvas.width;
const H     = canvas.height;
const HUD_H = 172;
const SIM_H = H - HUD_H;
const GRID  = 80;
const CW    = W     / GRID;
const CH    = SIM_H / GRID;

/* ══════════════════════════════════════════════
   PALETTE
══════════════════════════════════════════════ */
const PAL = {
  bg:    '#000810',
  hud:   '#00060e',
  bdr:   '#0a1530',
  text:  '#2a4488',
  textB: '#5577cc',
  textH: '#99bbff',
};

const SPECIES = [
  { name:'HERBI', hue:130 },
  { name:'CARNI', hue:  0 },
  { name:'OMNI',  hue:210 },
];

function sCol(sid, lineage, sat=80, lit=65, subspecies=0) {
  // v23 : sous-espèce décale la teinte de +60° par ID
  const subShift = subspecies > 0 ? (subspecies * 60) % 120 : 0;
  const h = (SPECIES[sid].hue + (lineage*23)%38 - 19 + subShift + 360) % 360;
  return `hsl(${h},${sat}%,${lit}%)`;
}

/* ══════════════════════════════════════════════
   ÉTOILES
══════════════════════════════════════════════ */
const STARS = Array.from({length:240}, () => ({
  x: Math.random()*W,
  y: Math.random()*SIM_H,
  r: Math.random()<0.13 ? 1.2 : 0.6,
  a: 0.10 + Math.random()*0.38,
  tw: Math.random()*Math.PI*2,
}));

function drawStars(t) {
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0, 0, W, SIM_H);
  for (const s of STARS) {
    const f = 0.82 + 0.18*Math.sin(t*0.0014 + s.tw);
    ctx.globalAlpha = s.a * f;
    ctx.fillStyle   = '#fff';
    ctx.fillRect(s.x|0, s.y|0, s.r, s.r);
  }
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════
   SAISONS v14  — cycle 4 états indépendant du climat
══════════════════════════════════════════════ */
const Season = {
  order:    ['spring','summer','autumn','winter'],
  durations: { spring:520, summer:680, autumn:460, winter:340 },
  idx:      0,
  timer:    0,

  get current() { return this.order[this.idx]; },

  step() {
    this.timer++;
    if (this.timer >= this.durations[this.current]) {
      this.timer = 0;
      this.idx   = (this.idx + 1) % 4;
      SeasonParticles.ptcls = [];
    }
  },

  solarMod() {
    switch(this.current){
      case 'spring': return 1.40;
      case 'summer': return 1.00;
      case 'autumn': return 0.70;
      case 'winter': return 0.42;
    }
  },

  metabMult(sid) {
    // v15 : hiver moins brutal — Carni 1.28 (était 1.55)
    switch(this.current){
      case 'spring': return 0.88;
      case 'summer': return 1.00;
      case 'autumn': return 1.08;
      case 'winter': return sid===0 ? 1.18 : (sid===1 ? 1.28 : 1.22); // v38
    }
  },

  label() {
    const ic = { spring:'🌱', summer:'☀', autumn:'🍂', winter:'❄' };
    return ic[this.current] + ' ' + this.current.toUpperCase();
  },

  color() {
    switch(this.current){
      case 'spring': return '#44dd55';
      case 'summer': return '#ffcc22';
      case 'autumn': return '#ff8833';
      case 'winter': return '#88bbff';
    }
  },

  progress() {
    return this.timer / this.durations[this.current];
  },

  // Teinte globale sur la sim
  worldTint() {
    switch(this.current){
      case 'spring': return [0,  30, 0,  0.04];
      case 'summer': return [0,   0, 0,  0.00];
      case 'autumn': return [30, 10, 0,  0.05];
      case 'winter': return [0,   0, 28, 0.09];
    }
  },
};

/* ── Particules saisonnières ─────────────────── */
const SeasonParticles = {
  ptcls: [],

  tick() {
    const s = Season.current;
    if (s==='winter' && Math.random()<0.55) {
      this.ptcls.push({
        x: Math.random()*W, y: -4,
        vx:(Math.random()-0.5)*0.35,
        vy: 0.55+Math.random()*0.7,
        r: 0.7+Math.random()*1.1,
        life: 180+Math.random()*160,
        autumn: false,
      });
    }
    if (s==='autumn' && Math.random()<0.20) {
      this.ptcls.push({
        x: Math.random()*W, y: Math.random()*(SIM_H*0.25),
        vx:(Math.random()-0.3)*1.4,
        vy: 0.7+Math.random()*0.8,
        r: 1.8,
        life: 110+Math.random()*90,
        autumn: true,
      });
    }
    for (let i=this.ptcls.length-1;i>=0;i--) {
      const p=this.ptcls[i];
      p.x+=p.vx; p.y+=p.vy; p.life--;
      p.vx+=(Math.random()-0.5)*0.05;
      if (p.y>SIM_H||p.x<-5||p.x>W+5||p.life<=0) this.ptcls.splice(i,1);
    }
  },

  draw() {
    for (const p of this.ptcls) {
      const a = Math.min(0.72, p.life/55);
      ctx.fillStyle = p.autumn
        ? `rgba(200,95,25,${(a*0.65).toFixed(2)})`
        : `rgba(210,235,255,${(a*0.55).toFixed(2)})`;
      ctx.globalAlpha = 1;
      ctx.fillRect(p.x|0, p.y|0, p.r, p.r);
    }
  },
};

/* ══════════════════════════════════════════════
   CLIMAT  (v4 effets + v5 cicatrices)
══════════════════════════════════════════════ */
const Climate = {
  state: 'normal',
  timer: 400,
  ptcls: [],

  next() {
    const r = Math.random();
    this.state = r<0.60 ? 'normal' : r<0.82 ? 'drought' : 'rain';
    this.timer = 240 + (Math.random()*220)|0;
    this.ptcls = [];
  },

  tick() {
    if (--this.timer <= 0) this.next();
    if (this.state==='rain' && Math.random()<0.42) {
      this.ptcls.push({ x:Math.random()*W, y:-4,
        vx:-0.4, vy:3.6+Math.random()*2, life:72 });
    }
    for (let i=this.ptcls.length-1;i>=0;i--) {
      const p=this.ptcls[i];
      p.x+=p.vx; p.y+=p.vy; p.life--;
      if (p.y>SIM_H||p.life<=0) this.ptcls.splice(i,1);
    }
  },

  solar() {
    if (this.state==='drought') return 0.28;
    if (this.state==='rain')    return 1.90;
    return 1.0;
  },

  overlay(t) {
    if (this.state==='drought') {
      ctx.fillStyle = 'rgba(65,22,0,0.07)';
      ctx.fillRect(0,0,W,SIM_H);
      ctx.strokeStyle='rgba(255,100,0,0.05)';
      ctx.lineWidth=1;
      for (let i=0;i<6;i++) {
        const y=((t*0.024+i*SIM_H/6)%SIM_H);
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+26);ctx.stroke();
      }
    } else if (this.state==='rain') {
      ctx.fillStyle = 'rgba(0,12,50,0.07)';
      ctx.fillRect(0,0,W,SIM_H);
      ctx.strokeStyle='rgba(80,140,255,0.48)';
      ctx.lineWidth=0.75;
      for (const p of this.ptcls) {
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x+p.vx*4,p.y+p.vy*4);
        ctx.stroke();
      }
    }
  },

  label() {
    if (this.state==='drought') return '☀ SÉCHERESSE';
    if (this.state==='rain')    return '☂ PLUIE';
    return '◆ NORMAL';
  },
  color() {
    if (this.state==='drought') return '#ff7711';
    if (this.state==='rain')    return '#44aaff';
    return '#224466';
  },
};
Climate.next();

/* ═════════ WORLD MIND ═════════ */

const WorldMind = {
  history: [],
  policy: {
    solarBoost: 1,
    mutationBoost: 1,
    stressBalance: 1
  },

  observe() {
    let bio = 0;
    for (let x=0;x<GRID;x++)
      for (let y=0;y<GRID;y++)
        bio += world[x][y].biomass;

    bio /= GRID*GRID;

    const pressure = popCache[1]/(popCache[0]+1);

    this.history.push({bio, pressure});
    if (this.history.length>120) this.history.shift();
  },

  learn() {
    if (this.history.length<40) return;

    const avgBio =
      this.history.reduce((a,b)=>a+b.bio,0)/this.history.length;

    const avgPressure =
      this.history.reduce((a,b)=>a+b.pressure,0)/this.history.length;

    if (avgBio < 0.28)
        this.policy.solarBoost *= 1.01;

    if (avgPressure > 0.9)
        this.policy.stressBalance *= 1.01;

    if (avgBio > 0.55)
        this.policy.solarBoost *= 0.998;
  }
};


/* ══════════════════════════════════════════════
   GRILLE MONDE
══════════════════════════════════════════════ */
const world = Array.from({length:GRID}, (_, x)=>
  Array.from({length:GRID}, (__, y)=>{
    // Points d'eau permanents : ~5% des cellules, répartis en clusters
    const wb = Math.random() < 0.045;
    return {
      biomass:   Math.random()*0.55,
      fertility: 0.35 + Math.random()*0.45,
      history:   0,
      stress:    0,
      terrOwner: -1,
      terrClaim: 0,
      terrSid:   -1,
      phero:     new Float32Array(3),
      moisture:  wb ? 0.85 + Math.random()*0.15 : 0.15 + Math.random()*0.35,
      waterBody: wb,
      habitat:   0,    // v35 : construit par Omni → réduit stress + augmente fertilité
    };
  })
);

function cellAt(px, py) {
  const gx=(px/CW)|0, gy=(((py%SIM_H+SIM_H)%SIM_H)/CH)|0;
  if (gx>=0&&gx<GRID&&gy>=0&&gy<GRID) return world[gx][gy];
  return null;
}

// v36 : Y toroïdal — plus de murs haut/bas
function wrapY(y) { return ((y % SIM_H) + SIM_H) % SIM_H; }
// Distance toroïdale sur Y (shortest path)
function deltaY(ay, by) {
  let d = by - ay;
  if (d >  SIM_H*0.5) d -= SIM_H;
  if (d < -SIM_H*0.5) d += SIM_H;
  return d;
}

/* ══════════════════════════════════════════════
   CERVEAU  (16 entrées × 10 cachés)  — v31 : +thirst +moisture
══════════════════════════════════════════════ */
const N_IN=16, N_HID=10;
const W_LEN = N_IN*N_HID + N_HID*2;

function randW() {
  const w = new Float32Array(W_LEN);
  for (let i=0;i<W_LEN;i++) w[i]=Math.random()*2-1;
  return w;
}

function crossover(a, b, mut=0.09) {
  const c   = new Float32Array(W_LEN);
  const cut = (Math.random()*W_LEN)|0;
  for (let i=0;i<W_LEN;i++)
    c[i] = (i<cut?a[i]:b[i]) + (Math.random()*2-1)*mut;
  return c;
}

function runBrain(inp, w) {
  const h=new Float32Array(N_HID);
  let k=0;
  for (let i=0;i<N_HID;i++) {
    let s=0;
    for (let j=0;j<N_IN;j++) s+=inp[j]*w[k++];
    h[i]=Math.tanh(s);
  }
  let ox=0,oy=0;
  for (let i=0;i<N_HID;i++){ox+=h[i]*w[k++];oy+=h[i]*w[k++];}
  return [Math.tanh(ox),Math.tanh(oy)];
}

/* ══════════════════════════════════════════════
   POPULATIONS CACHÉES — v14 fix O(n²)
══════════════════════════════════════════════ */
const popCache  = [0,0,0];   // mis à jour une fois par tick dans loop()
const energySum = [0,0,0];   // somme énergies par espèce

/* ══════════════════════════════════════════════
   ORGANISME
══════════════════════════════════════════════ */
let organisms  = [];
let births     = [];
let lineageNext = 0;

/* ══════════════════════════════════════════════
   SPÉCIATION DYNAMIQUE v23
   Distance génomique sur 5 traits → sous-espèce
══════════════════════════════════════════════ */
let subspeciesNext = 1;
const speciationLog = [];   // { tick, sid, subId, parentLineage }

function geneticDistance(a, b) {
  // Distance normalisée sur 5 traits génomiques réels
  return Math.abs(a.speed     - b.speed)     / 2.6
       + Math.abs(a.metab     - b.metab)     / 0.7
       + Math.abs(a.brainMass - b.brainMass) / 1.2
       + Math.abs(a.camo      - b.camo)
       + Math.abs(a.toxin     - b.toxin);
}

function checkSpeciation(parent, child) {
  // Seuil : distance > 2.0 + chance 3% par reproduction
  if (geneticDistance(parent, child) > 2.0 && Math.random() < 0.03) {
    child.subspecies = subspeciesNext++;
    child.lineage    = lineageNext++;   // nouvelle lignée
    speciationLog.push({ tick, sid: child.sid, subId: child.subspecies,
                         parentLineage: parent.lineage });
    if (speciationLog.length > 5) speciationLog.shift();
  }
}

/* ══════════════════════════════════════════════
   INTELLIGENCE COLLECTIVE / ESSAIM v23
══════════════════════════════════════════════ */
// Stocke le vecteur de consensus du groupe pour chaque organisme
// Calculé dans step() via scan voisins

class Organism {
  constructor(sid, p1=null, p2=null) {
    this.sid      = sid;
    this.dead     = false;
    this.age      = 0;
    this.cooldown = 0;
    this.energy   = 6 + Math.random()*4;
    this.memory   = 0;
    this.weaponCD = 0;
    this.herdMemory = 0;
    this.culturalBias = Math.random()*2-1;
    this.huntFatigue  = 0;
    // v14 — traînée visuelle
    this._lastDx = 0;
    this._lastDy = 0;
    // v31 — cycle de l'eau
    this.thirst    = Math.random() * 0.3;  // 0=hydraté, 1=mort de soif
    this.hydration = 0.7 + Math.random()*0.3;
    // v33 — civilisation Omni + RAGE Carni
    this.hasTool   = false;
    this.learning  = 0;
    this.signal    = 0;
    this.rage      = 0;
    // v38 — Seigneurs Omni
    this.isLord      = false;   // statut seigneur
    this.lordPrestige= 0;       // 0–100, grandit avec kills, âge, vassaux
    this.lordOf      = null;    // référence au seigneur suzerain (vassal→seigneur)
    this.lordDomain  = 180;     // rayon du domaine
    // v35 — patches utilisateur intégrés
    this.domesticated = false;   // Herbi domestiqué par Omni
    this.tool      = null;       // { power, life } outil défensif Omni
    this.packId    = (Math.random()*10000)|0;  // ID meute Carni
    // Territoire Carni : centre de référence initialisé au premier step
    this.territory = null;

    // v28 — capacités culturelles transmissibles
    const _ac = { toolUse:0.04, communication:0.03, migration:0.025, groupHunting:0.05 };
    this.abilities = {
      toolUse:      { active: Math.random()<_ac.toolUse,                       level:1, usage:0 },
      communication:{ active: Math.random()<_ac.communication,                 level:1, usage:0 },
      migration:    { active: Math.random()<_ac.migration,                     level:1, usage:0 },
      groupHunting: { active: Math.random()<_ac.groupHunting && sid===1,       level:1, usage:0 },
    };
    // v28 — épidémie
    this.infected = false;
    this.immunity = 0;

    if (p1&&p2) {
      this.brainW    = crossover(p1.brainW, p2.brainW);
      this.lineage   = p1.lineage;
      this.speed     = Math.max(0.4, (p1.speed+p2.speed)/2 + (Math.random()*0.26-0.13));
      this.metab     = Math.max(0.1, (p1.metab+p2.metab)/2  + (Math.random()*0.07-0.035));
      this.brainMass = Math.max(0.3, (p1.brainMass+p2.brainMass)/2+(Math.random()*0.10-0.05));
      this.camo  = this.sid===0
        ? Math.max(0, Math.min(1, (p1.camo+p2.camo)/2    + (Math.random()*0.12-0.06)))
        : 0;
      this.toxin = this.sid===0
        ? Math.max(0, Math.min(1, (p1.toxin+p2.toxin)/2  + (Math.random()*0.10-0.05)))
        : 0;
      this.subspecies = p1.subspecies || 0;  // v23 : héritage sous-espèce
      this.x = ((p1.x+(Math.random()*18-9))+W)%W;
      this.y = wrapY(p1.y+(Math.random()*18-9));
      // v28 : héritage capacités (50% de chaque parent + mutation)
      this.abilities = {};
      for (const key in p1.abilities) {
        const a1=p1.abilities[key], a2=p2.abilities[key]||{active:false,level:1,usage:0};
        const inherited = (a1.active&&Math.random()<0.7)||(a2.active&&Math.random()<0.35);
        this.abilities[key] = { active: inherited || Math.random()<0.008, level:1, usage:0 };
      }
      this.infected = false;
      this.immunity = 0;
    } else {
      this.brainW    = randW();
      this.lineage   = lineageNext++;
      this.speed     = 0.7 + Math.random()*1.9;
      this.metab     = 0.2  + Math.random()*0.5;
      this.brainMass = 0.4  + Math.random()*0.8;
      this.camo      = this.sid===0 ? Math.random()*0.5 : 0;
      this.toxin     = this.sid===0 ? Math.random()*0.4 : 0;
      this.subspecies = 0;   // v23 : 0=souche, 1+=sous-espèce
      this.x = Math.random()*W;
      this.y = Math.random()*SIM_H;
    }
  }

  step() {
    if (this.dead) return;
    this.age++;
    this.weaponCD    = Math.max(0, this.weaponCD-1);
    this.huntFatigue *= 0.92;
    // v35 : eco-balance — Herbi bas → Carni accumule fatigue de chasse
    if (this.sid===1 && popCache[0] < 25) {
      this.huntFatigue = Math.min(1, this.huntFatigue + 0.015);
    }
    if (this.cooldown>0) this.cooldown--;

    // v33 : reset des compteurs de scan
    this._nearToolCount  = 0;
    this._signalIn       = 0;
    this._omniAllyCount  = 0;
    this._omniNear       = 0;
    // v35 : reset centroïde herd
    this._herdSumX = 0;
    this._herdSumY = 0;
    this._herdSumN = 0;

    const c = cellAt(this.x, this.y);
    if (!c) { this.dead=true; return; }
    // v36 : ratio Carni/Herbi — calculé une fois, utilisé partout dans le step
    const carniRatio = popCache[0] > 0 ? popCache[1] / popCache[0] : 99;

    /* ── Dépôt phéromones ──────────────────── */
    c.phero[this.sid] = Math.min(1, c.phero[this.sid] + 0.06);
    if (this.sid===0 && this.energy < 5)
      c.phero[0] = Math.min(1, c.phero[0] + 0.12);

    /* ── Détection voisins ─────────────────── */
    let nearMate=null, nearMateDist=1e9;
    let nearPrey=null, nearPreyDist=1e9;
    let nearHost=null, nearHostDist=1e9;        // Omni → Carni (DRAIN/GUARD/CRISIS)
    let nearWeakHerbi=null, nearWHDist=1e9;     // Omni → Herbi faible (CULL)
    let nearOmni=null, nearOmniDist=1e9;        // Herbi → Omni (mob)
    let symPart =null, symDist=1e9;
    let mobCount   = 0;
    let herdCount  = 0;
    let carniNear  = false;
    let packNear   = 0;

    // v18 : Herbi a un rayon de détection plus large (vigilance évoluée)
    const herbiBonus = this.sid===0 ? 1.35 : 1.0;
    const baseSR = (95 + this.brainMass*25) * herbiBonus;
    const SR2    = baseSR * baseSR;

    for (const o of organisms) {
      if (o===this||o.dead) continue;
      // v36 : distances toroïdales (X déjà toroïdal, Y maintenant aussi)
      let dx=o.x-this.x;
      if (dx >  W*0.5) dx -= W;
      if (dx < -W*0.5) dx += W;
      const dy=deltaY(this.y, o.y);
      const d2=dx*dx+dy*dy;

      // Camouflage Herbi
      let effectiveSR2 = SR2;
      if (this.sid===1 && o.sid===0) {
        const cc = cellAt(o.x, o.y);
        const camoEffect = o.camo * (cc ? cc.biomass : 0);
        effectiveSR2 = SR2 * Math.pow(1 - camoEffect*0.75, 2);
      }
      if (d2 > effectiveSR2) continue;

      if (o.sid===this.sid && d2<nearMateDist)
        { nearMate=o; nearMateDist=d2; }

      if (this.sid===0 && o.sid===0 && d2<(55*55)) herdCount++;
      // v18 : sprint déclenché dès 120px (détection anticipée)
      if (this.sid===0 && o.sid===1 && d2<(120*120)) carniNear=true;
      // v18 : alarme de troupeau — si congénère en sprint, propager l'alerte
      if (this.sid===0 && o.sid===0 && d2<(80*80) && o._alarmEmit) carniNear=true;
      // v16 : meute Carni
      if (this.sid===1 && o.sid===1 && d2<(90*90)) packNear++;

      // Carni chasse : Herbi prioritaire, puis Omni affaibli
      const isPrey = (this.sid===1 && o.sid===0) ||
                     (this.sid===1 && o.sid===2 && o.energy<6);
      if (isPrey && d2<nearPreyDist) { nearPrey=o; nearPreyDist=d2; }

      // Omni trouve Carni (parasite / GUARD / CRISIS)
      if (this.sid===2 && o.sid===1 && d2<nearHostDist)
        { nearHost=o; nearHostDist=d2; }

      // Omni trouve Herbi faible (CULL / CRISIS)
      if (this.sid===2 && o.sid===0 && o.energy<8.0 && d2<nearWHDist)
        { nearWeakHerbi=o; nearWHDist=d2; }

      // v33 : Omni — apprentissage collectif (compte congénères proches avec outil)
      if (this.sid===2 && o.sid===2 && d2<(70*70) && o.hasTool)
        this._nearToolCount = (this._nearToolCount||0) + 1;

      // v33 : Omni — accumulation signal collectif
      if (this.sid===2 && o.sid===2 && d2<(80*80) && o.signal>0.4)
        this._signalIn = (this._signalIn||0) + o.signal * 0.04;

      // v33 : Omni — compte alliés proches (pour camps et coordination)
      if (this.sid===2 && o.sid===2 && d2<(80*80))
        this._omniAllyCount = (this._omniAllyCount||0) + 1;

      // v33 : Carni — compte Omni proches pour RAGE
      if (this.sid===1 && o.sid===2 && d2<(110*110))
        this._omniNear = (this._omniNear||0) + 1;

      // v35 : Carni — centroïde du troupeau Herbi (pour alliance multi-meute)
      if (this.sid===1 && o.sid===0 && d2<(170*170)) {
        this._herdSumX = (this._herdSumX||0) + o.x;
        this._herdSumY = (this._herdSumY||0) + o.y;
        this._herdSumN = (this._herdSumN||0) + 1;
      }

      // Herbi trouve Omni (mob) — FIX v14 : nearOmni au lieu de nearHost
      if (this.sid===0 && o.sid===2 && d2<(55*55)) {
        mobCount++;
        if (d2<nearOmniDist) { nearOmni=o; nearOmniDist=d2; }
      }

      if (o.sid===this.sid&&o.lineage!==this.lineage&&d2<symDist)
        { symPart=o; symDist=d2; }
    }

    const mateDist  = nearMate ? Math.sqrt(nearMateDist) : 999;
    const preyDist  = nearPrey ? Math.sqrt(nearPreyDist) : 999;
    const hostDist  = nearHost ? Math.sqrt(nearHostDist) : 999;
    const symDist2  = symPart  ? Math.sqrt(symDist)      : 999;

    if (this.sid===0) {
      this._herdCount = herdCount;
      this._carniNear = carniNear;
    }
    if (this.sid===1) {
      this._packNear = packNear;   // v16
    }

    /* ── Essaim v23 : consensus directionnel ── */
    if (this.sid===0 && herdCount >= 5) {
      // Moyenne des vecteurs de mouvement des congénères proches → suivre le groupe
      let sumDx=0, sumDy=0, cnt=0;
      for (const o of organisms) {
        if (o===this||o.dead||o.sid!==0) continue;
        let ddx=o.x-this.x; if(ddx>W*0.5)ddx-=W; if(ddx<-W*0.5)ddx+=W;
      const ddy=deltaY(this.y,o.y);
        if (ddx*ddx+ddy*ddy < 100*100) {
          sumDx+=o._lastDx||0; sumDy+=o._lastDy||0; cnt++;
        }
      }
      if (cnt>0) {
        this._swarmDx = sumDx/cnt;
        this._swarmDy = sumDy/cnt;
      }
    } else {
      this._swarmDx = 0;
      this._swarmDy = 0;
    }

    /* ── Essaim Omni : consensus de mode ── */
    if (this.sid===2) {
      let scvC=0, grdC=0, drnC=0, culC=0, tndC=0, criC=0;
      for (const o of organisms) {
        if (o===this||o.dead||o.sid!==2) continue;
        let ddx=o.x-this.x; if(ddx>W*0.5)ddx-=W; if(ddx<-W*0.5)ddx+=W;
      const ddy=deltaY(this.y,o.y);
        if (ddx*ddx+ddy*ddy < 90*90) {
          const m=o._omniMode||'TEND';
          if(m==='SCAVENGE')scvC++;
          else if(m==='GUARD')grdC++;
          else if(m==='DRAIN')drnC++;
          else if(m==='CULL')culC++;
          else if(m==='CRISIS')criC++;
          else tndC++;
        }
      }
      const totalOC = scvC+grdC+drnC+culC+tndC+criC;
      // CRISIS ne se propage pas par consensus (individuel)
      if (totalOC >= 3 && criC < totalOC) {
        const best = Math.max(scvC,grdC,drnC,culC,tndC);
        this._omniConsensus = best===scvC?'SCAVENGE':best===grdC?'GUARD'
                             :best===drnC?'DRAIN':best===culC?'CULL':'TEND';
      } else {
        this._omniConsensus = null;
      }
    }

    /* ── Cerveau (16 inputs) ───────────────── */
    // FIX v31 : Herbi utilise carniNear distance (était hostDist = toujours 999)
    let herbThreatDist  = 999;
    let herbThreatAngle = 0;
    if (this.sid===0) {
      // Cherche le Carni le plus proche dans le rayon de scan
      for (const o of organisms) {
        if (o.dead||o.sid!==1) continue;
        let dx2=o.x-this.x; if(dx2>W*0.5)dx2-=W; if(dx2<-W*0.5)dx2+=W;
        const dy2=deltaY(this.y,o.y);
        const d2=dx2*dx2+dy2*dy2;
        if (d2 < SR2 && d2 < herbThreatDist*herbThreatDist) {
          herbThreatDist  = Math.sqrt(d2);
          herbThreatAngle = Math.atan2(dy2,dx2)/Math.PI;
        }
      }
    }
    const threatDist  = this.sid===0 ? herbThreatDist  : preyDist;
    const threatAngle = this.sid===0 ? herbThreatAngle
      : (nearPrey ? Math.atan2(deltaY(this.y,nearPrey.y), nearPrey.x-this.x)/Math.PI : 0);

    // v18 : danger local (phero Carni max dans rayon 2 cellules)
    let localDanger = c.phero[1];
    if (this.sid===0) {
      const gxI=(this.x/CW)|0, gyI=(this.y/CH)|0;
      for (let ddx=-2;ddx<=2;ddx++) for (let ddy=-2;ddy<=2;ddy++) {
        const nx=gxI+ddx, ny=gyI+ddy;
        if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID)
          localDanger = Math.max(localDanger, world[nx][ny].phero[1]);
      }
    }
    // Angle de fuite optimal
    let fleeAngle = 0;
    if (this.sid===0 && localDanger > 0.12) {
      const gxI2=(this.x/CW)|0, gyI2=(this.y/CH)|0;
      let sumX=0, sumY=0;
      for (let ddx=-2;ddx<=2;ddx++) for (let ddy=-2;ddy<=2;ddy++) {
        const nx=gxI2+ddx, ny=gyI2+ddy;
        if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID) {
          const ph=world[nx][ny].phero[1];
          sumX+=ddx*ph; sumY+=ddy*ph;
        }
      }
      fleeAngle = (sumX!==0||sumY!==0) ? Math.atan2(sumY,sumX)/Math.PI : 0;
    }

    // v31 : moisture locale max (gradient vers l'eau)
    let localMoisture = c.moisture;
    let moistDx=0, moistDy=0;
    {
      const gxM=(this.x/CW)|0, gyM=(this.y/CH)|0;
      let bestM = c.moisture;
      for (let ddx=-2;ddx<=2;ddx++) for (let ddy=-2;ddy<=2;ddy++) {
        const nx=gxM+ddx, ny=gyM+ddy;
        if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID) {
          const m=world[nx][ny].moisture;
          if (m>bestM) { bestM=m; moistDx=ddx; moistDy=ddy; }
          localMoisture = Math.max(localMoisture, m);
        }
      }
    }

    const inp = new Float32Array([
      this.energy/16,                                               // 0
      c.biomass,                                                    // 1
      c.fertility,                                                  // 2
      c.history,                                                    // 3
      c.stress,                                                     // 4
      c.terrOwner===this.lineage ? 1 : 0,                          // 5
      this.memory,                                                  // 6
      Math.min(1, mateDist/100),                                   // 7
      nearMate ? Math.atan2(deltaY(this.y,nearMate.y),nearMate.x-this.x)/Math.PI : 0, // 8
      Math.min(1, threatDist/100),                                 // 9  FIX
      threatAngle,                                                  // 10 FIX
      Climate.state==='drought'?1:Climate.state==='rain'?-1:0,    // 11
      c.phero[0],                                                   // 12
      localDanger,                                                  // 13
      this.thirst,                                                  // 14 NEW
      localMoisture,                                                // 15 NEW
    ]);

    // v35 : finalise centroïde herd Carni
    if (this.sid===1 && this._herdSumN > 0) {
      this._herdCentX = this._herdSumX / this._herdSumN;
      this._herdCentY = this._herdSumY / this._herdSumN;
    } else if (this.sid===1) {
      this._herdCentX = undefined;
    }

    let [mx,my] = runBrain(inp, this.brainW);
    mx += this.culturalBias*0.05;

    // v18 : nudge cerveau Herbi vers fuite optimale si danger détecté
    if (this.sid===0 && localDanger > 0.12) {
      const fMag = Math.min(0.5, (localDanger-0.12)*1.2);
      mx -= Math.sin(fleeAngle*Math.PI) * fMag;
      my -= Math.cos(fleeAngle*Math.PI) * fMag;
    }

    // v34 : Herbi fuit le centre si Carni le domine
    if (this.sid===0 && zoneControl.dominant===1 && zoneControl.counts[1] > 4) {
      let zcDx = this.x - ZONE_CX; if(zcDx>W*0.5)zcDx-=W; if(zcDx<-W*0.5)zcDx+=W; // fuite = direction opposée
      const zcDy = deltaY(ZONE_CY, this.y);
      const zcD  = Math.sqrt(zcDx*zcDx + zcDy*zcDy);
      if (zcD < ZONE_R * 1.4 && zcD > 5) {
        const fleeF = Math.min(0.45, (ZONE_R * 1.4 - zcD) / ZONE_R * 0.5);
        mx += (zcDx/zcD) * fleeF;
        my += (zcDy/zcD) * fleeF;
      }
    }

    // v23 : essaim Herbi — nudge vers direction consensus du groupe
    if (this.sid===0 && herdCount >= 5 && !carniNear) {
      const swDx = this._swarmDx || 0, swDy = this._swarmDy || 0;
      const swLen = Math.sqrt(swDx*swDx+swDy*swDy);
      if (swLen > 0.01) {
        mx += (swDx/swLen) * 0.28;  // attraction modérée
        my += (swDy/swLen) * 0.28;
        this.energy -= 0.002;        // coût coordination
      }
    }

    // v16 : Carni attirés par phéromone de chasse des congénères
    if (this.sid===1 && c.phero[1] > 0.15) {
      let bestPh = c.phero[1], bx=0, by=0;
      const gx2=(this.x/CW)|0, gy2=(this.y/CH)|0;
      for (let ddx=-1;ddx<=1;ddx++) for (let ddy=-1;ddy<=1;ddy++) {
        if (ddx===0&&ddy===0) continue;
        const nx=gx2+ddx, ny=gy2+ddy;
        if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID) {
          const ph = world[nx][ny].phero[1];
          if (ph > bestPh) { bestPh=ph; bx=ddx; by=ddy; }
        }
      }
      if (bestPh > c.phero[1]) { mx+=bx*0.35; my+=by*0.35; }
    }
    /* ── Carni : attraction vers zone centrale v34 ──────────────
       - Si Omni domine le centre → Carni essaie de reprendre (RAGE)
       - Sinon → légère attraction si proie dans la zone
    ─────────────────────────────────────────────────────────── */
    if (this.sid===1) {
      let zcDx = ZONE_CX - this.x; if(zcDx>W*0.5)zcDx-=W; if(zcDx<-W*0.5)zcDx+=W;
      const zcDy = deltaY(this.y, ZONE_CY);
      const zcD  = Math.sqrt(zcDx*zcDx + zcDy*zcDy);
      const inZone = zcD < ZONE_R;
      const dom = zoneControl.dominant;
      // Carni pousse vers le centre si Omni domine et en RAGE
      if (!inZone && dom===2 && this.rage > 0.3) {
        const force = Math.min(0.70, this.rage * 0.75);
        mx += (zcDx/zcD) * force;
        my += (zcDy/zcD) * force;
      }
      // Attraction légère si Herbi y est nombreux
      if (!inZone && dom===0 && zoneControl.counts[0] > 5) {
        mx += (zcDx/zcD) * 0.25;
        my += (zcDy/zcD) * 0.25;
      }
    }

    // v32 : Carni fuit les zones phero[2] fortes (Omni CRISIS)
    if (this.sid===1 && c.phero[2] > 0.20) {
      const gxF=(this.x/CW)|0, gyF=(this.y/CH)|0;
      let worstP2=c.phero[2], wpx=0, wpy=0;
      for (let ddx=-1;ddx<=1;ddx++) for (let ddy=-1;ddy<=1;ddy++) {
        if (ddx===0&&ddy===0) continue;
        const nx=gxF+ddx, ny=gyF+ddy;
        if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID) {
          const p2=world[nx][ny].phero[2];
          if (p2>worstP2) { worstP2=p2; wpx=ddx; wpy=ddy; }
        }
      }
      if (worstP2 > c.phero[2]) {
        const fStr=Math.min(0.45,(worstP2-0.20)*1.2);
        mx-=wpx*fStr; my-=wpy*fStr;
      }
    }

    /* ── Omni : nudges directionnels v32 ──────────────────────
       Le cerveau seul ne suffit pas — chaque mode applique un vecteur
       directionnel explicite vers sa cible. Force variable selon urgence.
    ─────────────────────────────────────────────────────────── */
    if (this.sid===2) {
      const oMode   = this._omniMode || 'TEND';
      const Cp = popCache[1], Hp = popCache[0];

      // Détection CRISIS : Carni dominant + stress environnemental
      const crisisNow = (Cp > Hp * 1.1) &&
                        (Pathogen.active || Climate.state==='drought'
                         || Season.current==='winter');
      if (crisisNow) this._omniMode = 'CRISIS';

      const mode = this._omniMode || 'TEND';

      // ── CRISIS / DRAIN / GUARD → vers Carni le plus proche ──
      if ((mode==='CRISIS'||mode==='DRAIN'||mode==='GUARD') && nearHost) {
        let ddx = nearHost.x - this.x; if(ddx>W*0.5)ddx-=W; if(ddx<-W*0.5)ddx+=W;
        const ddy = deltaY(this.y, nearHost.y);
        const dd  = Math.sqrt(ddx*ddx+ddy*ddy) + 0.001;
        const force = mode==='CRISIS' ? 1.10 : mode==='DRAIN' ? 0.75 : 0.60;
        mx += (ddx/dd) * force;
        my += (ddy/dd) * force;
        // CRISIS : boost de vitesse
        if (mode==='CRISIS') {
          this._omniSpeedMult = 1.65;
        }
      }

      // ── CULL → vers Herbi affaibli le plus proche ────────────
      if (mode==='CULL' && nearWeakHerbi) {
        const ddx = nearWeakHerbi.x - this.x;
        const ddy = deltaY(this.y, nearWeakHerbi.y);
        const dd  = Math.sqrt(ddx*ddx+ddy*ddy) + 0.001;
        mx += (ddx/dd) * 0.65;
        my += (ddy/dd) * 0.65;
      }

      // ── SCAVENGE → gradient high-history (déjà calculé via grid) ─
      if (mode==='SCAVENGE') {
        const gxS=(this.x/CW)|0, gyS=(this.y/CH)|0;
        let bestHist=c.history, bhx=0, bhy=0;
        for (let dxx=-3;dxx<=3;dxx++) for (let dyy=-3;dyy<=3;dyy++) {
          const nx=gxS+dxx, ny=gyS+dyy;
          if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID&&world[nx][ny].history>bestHist) {
            bestHist=world[nx][ny].history; bhx=dxx; bhy=dyy;
          }
        }
        if (bestHist > c.history + 0.05) {
          const dd=Math.sqrt(bhx*bhx+bhy*bhy)+0.001;
          mx+=(bhx/dd)*0.50; my+=(bhy/dd)*0.50;
        }
      }

      // ── TEND → vers Herbi proche (mutualisme) ────────────────
      if (mode==='TEND' && nearWeakHerbi) {
        const ddx = nearWeakHerbi.x - this.x;
        const ddy = deltaY(this.y, nearWeakHerbi.y);
        const dd  = Math.sqrt(ddx*ddx+ddy*ddy) + 0.001;
        mx += (ddx/dd) * 0.28;
        my += (ddy/dd) * 0.28;
      }

      /* ── Omni : attraction vers la ZONE CENTRALE v34 ────────────
         Force permanente, modulée par l'état du contrôle :
         - Carni domine : urgence max (reconquête)
         - Omni domine  : maintien léger
         - Neutre       : attraction modérée
      ─────────────────────────────────────────────────────────── */
      {
        let zcDx = ZONE_CX - this.x; if(zcDx>W*0.5)zcDx-=W; if(zcDx<-W*0.5)zcDx+=W;
        const zcDy = deltaY(this.y, ZONE_CY);
        const zcDist = Math.sqrt(zcDx*zcDx + zcDy*zcDy);
        // Hors zone → nudge fort ; dans la zone → nudge faible (tenir le terrain)
        const inZone = zcDist < ZONE_R;
        const dom = zoneControl.dominant;
        const baseForce = inZone
          ? (dom===1 ? 0.55 : 0.18)    // Carni contrôle → résiste fort
          : (dom===1 ? 0.90 : dom===2 ? 0.40 : 0.60);  // hors zone → force selon contexte
        if (zcDist > 5) {
          mx += (zcDx/zcDist) * baseForce;
          my += (zcDy/zcDist) * baseForce;
        }
        // En mode CRISIS ou GUARD, force supplémentaire si Carni domine le centre
        if ((mode==='CRISIS'||mode==='GUARD') && dom===1) {
          mx += (zcDx/zcDist) * 0.35;
          my += (zcDy/zcDist) * 0.35;
        }
      }

      /* ── Omni civilisation v33+v35 ────────────────────────────────
         hasTool débloque : camps, signal amplifié, boost vitesse,
         habitat, ferme (Herbi domestiqués), outil défensif
      ─────────────────────────────────────────────────────────── */
      // Apprentissage — toutes les 10 ticks seulement
      if (tick % 10 === 0) {
        const nearTools = this._nearToolCount || 0;
        this.learning += nearTools * 0.012;
        if (this.learning > 1.5) {
          this.hasTool = true;
          this.learning *= 0.55;
        }
        this._nearToolCount = 0;
      }

      // Propagation signal
      const sigIn = this._signalIn || 0;
      this._signalIn = 0;
      const allyCount = this._omniAllyCount || 0;
      if (allyCount >= 2) {
        this.signal = Math.min(1, this.signal + 0.055 + sigIn);
      } else {
        this.signal *= 0.94;
      }

      // hasTool : comportements avancés
      if (this.hasTool) {
        // Bonus vitesse collectif (signal fort)
        if (this.signal > 0.45) {
          const speedBonus = Math.min(0.32, (this.signal - 0.45) * 0.65);
          mx *= (1 + speedBonus);
          my *= (1 + speedBonus);
        }

        // Création de camp si 4+ alliés proches, pas de camp existant
        if (allyCount >= 4 && tick % 30 === 0) {
          let campNear = false;
          for (const cp of omniCamps) {
            const cdx=cp.x-this.x, cdy=cp.y-this.y;
            if (cdx*cdx+cdy*cdy < CAMP_RADIUS*CAMP_RADIUS) { campNear=true; break; }
          }
          if (!campNear) {
            omniCamps.push({ x:this.x, y:this.y, life:CAMP_LIFESPAN, strength:0.5 });
          }
        }

        // Bonus camp proche → énergie + mouvement vers camp si besoin
        for (const cp of omniCamps) {
          const cdx=cp.x-this.x, cdy=cp.y-this.y;
          const cd2=cdx*cdx+cdy*cdy;
          if (cd2 < CAMP_RADIUS*CAMP_RADIUS) {
            this.energy += 0.018 * cp.strength;
            // Défense : si Carni dans le camp, converge dessus
            if (nearHost) {
              const hd2 = nearHostDist;
              const hcx = nearHost.x - cp.x, hcy = nearHost.y - cp.y;
              if (hcx*hcx+hcy*hcy < CAMP_RADIUS*CAMP_RADIUS) {
                const hd=Math.sqrt(hd2)+0.001;
                mx += ((nearHost.x-this.x)/hd) * 0.55;
                my += (deltaY(this.y,nearHost.y)/hd) * 0.55;
              }
            }
          }
        }
      }
      this._omniAllyCount = allyCount; // sera recalculé au prochain tick

      /* ── v35 : Habitat, ferme, outil défensif ─────────────────── */
      // Construction habitat (probabilité faible, cumule sur la cellule)
      if (Math.random() < 0.0018) {
        c.habitat = Math.min(3, c.habitat + 0.6);
      }

      // Ferme : protège et enrichit les Herbi proches → domestication douce
      // Ne scan que si hasTool (comportement avancé)
      if (this.hasTool) {
        // v36 : early-exit sur tous les scans (perf O(n) limité)
        let farmCount = 0;
        for (let fi=0; fi<organisms.length && farmCount<3; fi++) {
          const o = organisms[fi];
          if (o.dead || o.sid !== 0) continue;
          let fdx=o.x-this.x; if(fdx>W*0.5)fdx-=W; if(fdx<-W*0.5)fdx+=W;
          const fdy=deltaY(this.y,o.y);
          if (fdx*fdx + fdy*fdy < 65*65) {
            o.energy += 0.008;
            o.domesticated = true;
            farmCount++;
          }
        }

        if (tick % 25 === 0) {
          let hCount = 0;
          for (let hi=0; hi<organisms.length && hCount<4; hi++) {
            const o = organisms[hi];
            if (o.dead || !o.domesticated) continue;
            let fdx=o.x-this.x; if(fdx>W*0.5)fdx-=W; if(fdx<-W*0.5)fdx+=W;
            const fdy=deltaY(this.y,o.y);
            if (fdx*fdx + fdy*fdy < 38*38 && o.energy > 8) {
              o.energy    -= 1.2;
              this.energy += 0.9;
              hCount++;
            }
          }
        }

        if (!this.tool && Math.random() < 0.0025) {
          this.tool = { power: 0.4 + Math.random()*0.4, life: 600 };
        }
        if (this.tool) {
          let toolHits = 0;
          for (let ti=0; ti<organisms.length && toolHits<4; ti++) {
            const o = organisms[ti];
            if (o.dead || o.sid !== 1) continue;
            let tdx=o.x-this.x; if(tdx>W*0.5)tdx-=W; if(tdx<-W*0.5)tdx+=W;
            const tdy=deltaY(this.y,o.y);
            if (tdx*tdx + tdy*tdy < 65*65) {
              o.energy -= 0.30 * this.tool.power;
              o._toolRepulse = Math.min(0.40, this.tool.power * 0.35);
              toolHits++;
            }
          }
          this.tool.life--;
          if (this.tool.life <= 0) this.tool = null;
        }
      }
    }

    /* ── Carni RAGE v33 ───────────────────────────────────────────
       Quand Omni > Herbi × 0.85 : le Carni cible aussi les Omni,
       vitesse +25%, damage sur Omni à portée
    ─────────────────────────────────────────────────────────── */
    if (this.sid===1) {
      const rageOn = carniRageActive();
      // Mise à jour rage (toutes les 20 ticks)
      if (tick % 20 === 0) this.rage = rageOn ? Math.min(1, this.rage+0.3) : this.rage*0.7;

      if (this.rage > 0.4) {
        // Boost vitesse via nudge (mx/my, pas vx/vy)
        const rageMag = this.rage * 0.28;
        if (nearHost) {  // nearHost pour Carni = null, mais si on a un Omni proche...
          // En RAGE, cherche Omni le plus proche dans la liste nearPrey existante
          // → déjà géré : nearPrey inclut Omni affaibli, on ajoute un nudge spécial
        }
        mx *= (1 + rageMag * 0.4);
        my *= (1 + rageMag * 0.4);

        // Damage direct sur Omni à portée (déjà dans la prochaine boucle)
        // → marqué sur this._rageActive pour usage dans le bloc Carni
        this._rageActive = this.rage > 0.4;
      } else {
        this._rageActive = false;
      }
    }

    // v18 : Herbi fuit le gradient de phéromone de chasse (même sans LOS)
    if (this.sid===0) {
      const gxH=(this.x/CW)|0, gyH=(this.y/CH)|0;
      let worstPh = c.phero[1], wdx=0, wdy=0;
      for (let ddx=-2;ddx<=2;ddx++) for (let ddy=-2;ddy<=2;ddy++) {
        if (ddx===0&&ddy===0) continue;
        const nx=gxH+ddx, ny=gyH+ddy;
        if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID) {
          const ph=world[nx][ny].phero[1];
          if (ph > worstPh) { worstPh=ph; wdx=ddx; wdy=ddy; }
        }
      }
      // Fuite du gradient (direction opposée à la source de danger)
      if (worstPh > 0.18) {
        const fStr = Math.min(0.6, (worstPh-0.18)*1.4);
        mx -= wdx * fStr;
        my -= wdy * fStr;
        // Alerte phéromone si fuite phéro (pas de Carni visible mais danger perçu)
        if (!carniNear) c.phero[0] = Math.min(1, c.phero[0]+0.08);
      }
    }

    // v18 : Cri d'alarme — Herbi qui voit un Carni émet phéro[0] fort + flag _alarmEmit
    if (this.sid===0 && carniNear) {
      c.phero[0]       = Math.min(1, c.phero[0] + 0.28);  // signal fort
      this._alarmEmit  = true;
    } else {
      this._alarmEmit  = false;
    }

    // Sprint de fuite Herbi (v17: réduit si encerclé via _sprintMult)
    // v23 : bonus essaim +15% vitesse si groupe >= 5
    const swarmBoost = (this.sid===0 && herdCount >= 5) ? 1.15 : 1.0;
    let sprintMult = 1.0 * swarmBoost;
    if (this.sid===0 && carniNear) {
      sprintMult = (this._sprintMult || 2.5) * swarmBoost;
      // Peur réduite en essaim (sécurité du nombre)
      this.energy -= herdCount >= 8 ? 0.022 : 0.035;
    }
    // Sprint phéro (pas de Carni visible mais phéro élevée) — plus léger
    if (this.sid===0 && !carniNear && c.phero[1] > 0.25) {
      sprintMult = 1.6;
      this.energy -= 0.012;
    }
    this._sprintMult = null; // reset

    // v35 : repulsion outil Omni (temporaire, via nudge sur mx/my)
    if (this.sid===1 && this._toolRepulse) {
      // Applique une réduction de vitesse sur ce tick uniquement
      mx *= (1 - this._toolRepulse);
      my *= (1 - this._toolRepulse);
      this._toolRepulse = null;
    }

    /* ── Carni : territoire + dispersion tactique v35 ─────────────
       Intégration des patches territoire + dispersion utilisateur,
       traduits en mx/my (vx/vy n'existent pas dans ce moteur)
    ─────────────────────────────────────────────────────────── */
    if (this.sid===1) {
      // Init territoire au premier step
      if (!this.territory) this.territory = { x: this.x, y: this.y };

      const pack = this._packNear || 0;

      // Meute forte → retour doux vers le centre de territoire
      if (pack >= 3) {
        const tdx = this.territory.x - this.x;
        const tdy = deltaY(this.y, this.territory.y);
        const td  = Math.sqrt(tdx*tdx+tdy*tdy)+0.001;
        if (td > 40) {
          mx += (tdx/td) * 0.22;
          my += (tdy/td) * 0.22;
        }
        // Déplace le centre vers les proies détectées (territoire suit la chasse)
        if (nearPrey) {
          this.territory.x += (nearPrey.x - this.territory.x) * 0.004;
          this.territory.y += (nearPrey.y - this.territory.y) * 0.004;
        }
      }

      // Solo → exploration (scout mode : légère dérive aléatoire)
      if (pack <= 1 && Math.random() < 0.04) {
        mx += (Math.random()-0.5) * 0.55;
        my += (Math.random()-0.5) * 0.55;
        // Déplace le territoire avec lui
        this.territory.x = this.x;
        this.territory.y = this.y;
      }

      // Dispersion si surpeuplé local sans proie
      if (!nearPrey && pack > 4) {
        mx += (Math.random()-0.5) * 0.55;
        my += (Math.random()-0.5) * 0.55;
      }

      // Alliance herd signal : nudge vers centroïde du troupeau détecté
      if (this._herdCentX !== undefined && pack >= 2) {
        const hcx = this._herdCentX - this.x;
        const hcy = this._herdCentY - this.y;
        const hcd = Math.sqrt(hcx*hcx+hcy*hcy)+0.001;
        if (hcd > 20) { mx += (hcx/hcd)*0.28; my += (hcy/hcd)*0.28; }
      }
    }

    // v32 : vitesse Omni selon mode (CRISIS = sprint)
    const omniSpeedMult = (this.sid===2 && this._omniSpeedMult) ? this._omniSpeedMult : 1.0;
    this._omniSpeedMult = null;
    const dx = mx*this.speed*sprintMult*omniSpeedMult;
    const dy = my*this.speed*sprintMult*omniSpeedMult;
    this._lastDx = dx;
    this._lastDy = dy;
    this.x = ((this.x + dx)+W)%W;
    this.y = wrapY(this.y + dy);

    /* ══════════════════════════════════════
       RPS interactions
    ══════════════════════════════════════ */

    /* ══════════════════════════════════════════════════════
       [1] CARNI — PRÉDATEUR APEX v30
       Gestionnaire de surpopulation stratégique

       5 modes adaptatifs selon état de l'écosystème :

       STALK     : solo ou meute < 3  → chasse patiente, métab réduit,
                   marque le territoire, attaque les isolés uniquement

       PACK      : meute >= 3  → chasse coordonnée, encerclement,
                   signal de rallye pour congénères, partage du repas

       AMBUSH    : Herbi dense proche + zone calme (phero[0] faible)
                   → embuscade à haute chance de succès, sprint unique

       TERRITORY : après 2 kills récents, domination de zone
                   → revenus passifs, déterrence phéro, peu de combat

       DORMANCY  : proie très rare (Herbi < 20) ou hiver + énergie < 6
                   → métabolisme réduit à 35%, quasi-immobile, picote

       Récompenses calibrées pour survie en minorité absolue.
    ══════════════════════════════════════════════════════ */
    if (this.sid===1) {
      const Hp = popCache[0];
      const pack = this._packNear || 0;

      // ─── Lecture d'état ──────────────────────────────────
      // Densité Herbi locale (rayon 80px)
      let localHerbi = 0;
      const gxC=(this.x/CW)|0, gyC=(this.y/CH)|0;
      let localPhero0 = c.phero[0];
      for (let dxx=-2;dxx<=2;dxx++) for (let dyy=-2;dyy<=2;dyy++) {
        const nx=gxC+dxx, ny=gyC+dyy;
        if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID) {
          localPhero0 = Math.max(localPhero0, world[nx][ny].phero[0]);
        }
      }
      for (const o of organisms) {
        if (o.dead||o.sid!==0) continue;
        let dx2=o.x-this.x; if(dx2>W*0.5)dx2-=W; if(dx2<-W*0.5)dx2+=W;
      const dy2=deltaY(this.y,o.y);
        if (dx2*dx2+dy2*dy2 < 80*80) localHerbi++;
      }

      // Compteur de kills récents (décroit naturellement)
      if (!this._killCount) this._killCount = 0;
      this._killCount *= 0.990;

      // ─── Sélection du mode ────────────────────────────────
      const dormancyTrigger = (Hp < 20 || Season.current==='winter') && this.energy < 6.5;
      const ambushReady     = localHerbi >= 4 && localPhero0 < 0.18 && !nearPrey;
      const territoryMode   = this._killCount > 1.2 && pack < 2;

      let carniMode;
      if      (dormancyTrigger)   carniMode = 'DORMANCY';
      else if (pack >= 3)         carniMode = 'PACK';
      else if (ambushReady)       carniMode = 'AMBUSH';
      else if (territoryMode)     carniMode = 'TERRITORY';
      else                        carniMode = 'STALK';
      this._carniMode = carniMode;

      // ─── MODE DORMANCY ───────────────────────────────────
      if (carniMode === 'DORMANCY') {
        // Picote doucement la biomasse disponible
        const gnaw = Math.min(0.018, c.biomass * 0.15);
        c.biomass   -= gnaw;
        this.energy += gnaw * 1.2;
        // Récupère un peu si cellule riche en historique
        if (c.history > 0.2) {
          const scav = Math.min(0.012, c.history * 0.08);
          c.history   -= scav;
          this.energy += scav * 2.5;
        }
        this._dormant = true;
      } else {
        this._dormant = false;
      }

      // ─── MODE STALK ──────────────────────────────────────
      // v36 : récompense réduite si Carni surpeuplé (compétition → proies épuisées)
      const huntRewardMult = carniRatio > 1.5
        ? Math.max(0.55, 1.0 - (carniRatio - 1.5) * 0.22)
        : 1.0;

      if (carniMode === 'STALK' && nearPrey && preyDist < 7.5) {
        const prey = nearPrey;
        // Cible préférentielle : Herbi isolé (herdCount < 3) ou affaibli
        const isolated = (prey._herdCount || 0) < 3;
        const weakened = prey.energy < 6.0;
        const baseHit  = isolated ? 0.68 : weakened ? 0.62 : 0.42;
        const herdShield = Math.max(0, Math.min(0.50, (prey._herdCount||0)*0.11));

        if (Math.random() < baseHit - herdShield) {
          if (prey.toxin > 0) {
            this.energy -= prey.toxin * 4.0;
            if (this.energy <= 0) { this._die(c); return; }
          }
          prey._die(cellAt(prey.x, prey.y));
          this.energy += (isolated ? 5.2 : 4.0) * huntRewardMult;  // prime sur proie isolée
          this._killCount += 1.0;
          this.huntFatigue += 0.3;
        } else {
          this.energy -= 0.30;
        }
        // Dépôt phéro de présence (discret en STALK)
        c.phero[1] = Math.min(1, c.phero[1] + 0.10);
      }

      // ─── MODE PACK ───────────────────────────────────────
      if (carniMode === 'PACK' && nearPrey && preyDist < 7.0) {
        const prey = nearPrey;
        const packBreak   = Math.min(prey._herdCount||0, pack) * 0.09;
        const herdShield  = Math.max(0, Math.min(0.60, (prey._herdCount||0)*0.12 - packBreak));
        const encircled   = pack >= 5;
        if (encircled && prey.sid===0) prey._sprintMult = 1.4;

        // Signal de rallye : phéro fort pour attirer les congénères
        c.phero[1] = Math.min(1, c.phero[1] + 0.28);

        const hitProb = (encircled ? 0.82 : 0.65) - herdShield;
        if (Math.random() < hitProb) {
          if (prey.toxin > 0) {
            this.energy -= prey.toxin * 4.5;
            if (this.energy <= 0) { this._die(c); return; }
          }
          prey._die(cellAt(prey.x, prey.y));
          const packBonus = 1 + Math.min(pack, 3) * 0.12;  // ×1.36 max
          const encBonus  = encircled ? 1.30 : 1.0;
          const gain = (prey.sid===0 ? 4.5 : 3.0) * packBonus * encBonus * (1 - herdShield*0.35) * huntRewardMult;
          this.energy += gain;
          this._killCount += 0.7;
          this.huntFatigue += 0.35;
          this.energy -= this.huntFatigue * 0.55;
        } else {
          this.energy -= pack >= 2 ? 0.15 : 0.38;
        }
      }

      // ─── MODE AMBUSH ─────────────────────────────────────
      if (carniMode === 'AMBUSH') {
        // Phase d'attente : économise de l'énergie jusqu'à la cible idéale
        if (!this._ambushReady) {
          this._ambushTimer = (this._ambushTimer || 0) + 1;
          if (this._ambushTimer > 18) {
            this._ambushReady = true;
            this._ambushTimer = 0;
          }
        }
        // Une fois prêt, cherche la proie la plus proche et frappe
        if (this._ambushReady && nearPrey && preyDist < 18) {
          const prey = nearPrey;
          const ambushHit = 0.82 - Math.min(0.35, (prey._herdCount||0)*0.10);
          if (Math.random() < ambushHit) {
            if (prey.toxin > 0) {
              this.energy -= prey.toxin * 3.5;
              if (this.energy <= 0) { this._die(c); return; }
            }
            prey._die(cellAt(prey.x, prey.y));
            this.energy += 5.8 * huntRewardMult;  // gain d'embuscade élevé
            this._killCount += 1.2;
            this.huntFatigue += 0.25;
          } else {
            this.energy -= 0.20;
          }
          this._ambushReady = false;
        }
      }

      // ─── MODE TERRITORY ──────────────────────────────────
      if (carniMode === 'TERRITORY') {
        // Marque forte du territoire
        c.phero[1] = Math.min(1, c.phero[1] + 0.18);
        c.terrOwner = this.lineage;
        c.terrSid   = 1;
        c.terrClaim = Math.min(1, c.terrClaim + 0.025);

        // Revenu passif du territoire possédé (rayon élargi)
        let terrIncome = 0;
        for (let dxx=-3;dxx<=3;dxx++) for (let dyy=-3;dyy<=3;dyy++) {
          const nx=gxC+dxx, ny=gyC+dyy;
          if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID&&world[nx][ny].terrOwner===this.lineage)
            terrIncome += 0.00045;
        }
        this.energy += terrIncome;

        // Attaque si proie entre dans la zone (hit facile car terrain connu)
        if (nearPrey && preyDist < 10) {
          const prey = nearPrey;
          if (Math.random() < 0.72) {
            if (prey.toxin > 0) {
              this.energy -= prey.toxin * 3.0;
              if (this.energy <= 0) { this._die(c); return; }
            }
            prey._die(cellAt(prey.x, prey.y));
            this.energy += 5.0 * huntRewardMult;
            this._killCount += 0.8;
          }
        }
      }

      // ─── Regen passive Carni (tous modes sauf PACK actif) ─
      if (carniMode !== 'PACK' && this.huntFatigue < 0.25 && this.energy < 9) {
        if (c.biomass > 0.25) this.energy += 0.010;
        // Scavenging : cadavres dans la zone
        if (c.history > 0.15) {
          const sc2 = Math.min(0.010, c.history * 0.06);
          c.history   -= sc2;
          this.energy += sc2 * 2.2;
        }
      }

      // ─── RAGE v33 : chasse Omni quand ils dominent ────────
      // Damage calibré 0.12 max (pas de kill instantané comme dans le patch)
      if (this._rageActive) {
        let nearestOmni=null, nearestOmniD2=1e9;
        for (const o of organisms) {
          if (o.dead||o.sid!==2) continue;
          let _rdx=o.x-this.x; if(_rdx>W*0.5)_rdx-=W; if(_rdx<-W*0.5)_rdx+=W;
          const _rdy=deltaY(this.y,o.y);
          const d2r=_rdx*_rdx+_rdy*_rdy;
          if (d2r < 40*40 && d2r < nearestOmniD2) { nearestOmni=o; nearestOmniD2=d2r; }
        }
        if (nearestOmni) {
          const dmg = 0.10 * this.rage;
          nearestOmni.energy -= dmg;
          this.energy        += dmg * 0.65;
          // Nudge vers cet Omni
          let _ndx=nearestOmni.x-this.x; if(_ndx>W*0.5)_ndx-=W; if(_ndx<-W*0.5)_ndx+=W;
          const _ndy=deltaY(this.y,nearestOmni.y);
          const rod = Math.sqrt(_ndx*_ndx+_ndy*_ndy)+0.001;
          mx += (_ndx/rod) * 0.40 * this.rage;
          my += (_ndy/rod) * 0.40 * this.rage;
        }
      }

      // ─── Bonus de pression de régulation ─────────────────
      // Plus Herbi est en surpopulation, plus Carni est récompensé
      if (Hp > 80) {
        const regBonus = Math.min(0.008, (Hp - 80) / 20000);
        this.energy += regBonus;
      }
    }

    // ══════════════════════════════════════════════════════
    // [2] OMNI — INGÉNIEUR ÉCOSYSTÈME v29
    //
    //  5 modes adaptatifs déterminés par l'état global :
    //
    //  SCAVENGE  : terrain riche en morts (history>0.35) → mange les restes
    //              nettoie les cellules, fertilise, récupère de l'énergie
    //
    //  GUARD     : Herbi en danger (Carni dominant, Herbi faible)
    //              escorte les Herbi, mobbing actif sur Carni proches
    //
    //  DRAIN     : Carni très dominant → parasite Carni (conservé)
    //
    //  CULL      : Herbi très surplus (>220) → cible les plus faibles
    //              (régulateur de surpopulation, gain modéré)
    //
    //  TEND      : équilibre → fertilise le sol, bonus collectif
    //              l'Omni améliore la fertility des cellules voisines
    //
    //  Récompense proportionnelle à la justesse du mode choisi.
    //  Pénalité si mauvaise lecture de l'état.
    // ══════════════════════════════════════════════════════
    if (this.sid===2) {
      const Hp = popCache[0], Cp = popCache[1], Op = popCache[2];
      const total = Hp + Cp + Op + 1;

      // ─── Lecture de l'état de l'écosystème ───────────────
      // Terrain local : moyenne history dans rayon 2 cellules
      const gxO=(this.x/CW)|0, gyO=(this.y/CH)|0;
      let localHistory = 0, lhCount = 0;
      for (let dxx=-2;dxx<=2;dxx++) for (let dyy=-2;dyy<=2;dyy++) {
        const nx=gxO+dxx, ny=gyO+dyy;
        if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID) {
          localHistory += world[nx][ny].history; lhCount++;
        }
      }
      localHistory = lhCount > 0 ? localHistory/lhCount : 0;

      const carniDominant  = Cp > Hp*0.45 && Cp > 10;
      const herbiSurplus   = Hp > 220;
      const herbiEndangered= Hp < 30 && Cp > 5;
      const richDead       = localHistory > 0.30;

      // ─── Sélection du mode (priorité décroissante) ────────
      // v32 : CRISIS ajouté — override tout si conditions réunies
      const crisisCondition = (Cp > Hp*1.1) &&
        (Pathogen.active || Climate.state==='drought' || Season.current==='winter');

      let rawMode;
      if      (crisisCondition)      rawMode = 'CRISIS';
      else if (richDead)             rawMode = 'SCAVENGE';
      else if (herbiEndangered)      rawMode = 'GUARD';
      else if (carniDominant)        rawMode = 'DRAIN';
      else if (herbiSurplus)         rawMode = 'CULL';
      else                           rawMode = 'TEND';

      // Consensus collectif (hors CRISIS qui est individuel)
      this._omniMode = (rawMode!=='CRISIS' && this._omniConsensus) ? this._omniConsensus : rawMode;
      const mode = this._omniMode;

      // ─── MODE CRISIS ──────────────────────────────────────
      // Omni devient chasseur toutes proies : Carni prioritaire,
      // puis Herbi affaibli si Carni hors portée
      // Tolérance zéro — aucun cooldown, aucun mode consensus
      if (mode === 'CRISIS') {
        // Attaque Carni proche (damage direct, pas de drain doux)
        if (nearHost) {
          const hostDist2 = Math.sqrt(nearHostDist);
          if (hostDist2 < 12) {
            const crisisDmg = 0.065 + (1 - Math.min(1, hostDist2/12)) * 0.035;
            nearHost.energy -= crisisDmg;
            this.energy     += crisisDmg * 0.70;
            if (nearHost.energy <= 0) {
              nearHost._die(cellAt(nearHost.x, nearHost.y));
              this.energy += 2.5;
            }
          } else if (hostDist2 < 30) {
            // En approche : drain à distance
            nearHost.energy -= 0.018;
            this.energy     += 0.012;
          }
        }
        // Fallback : Herbi affaibli si aucun Carni accessible
        if (!nearHost && nearWeakHerbi && this.weaponCD===0) {
          const wdist = Math.sqrt(nearWHDist);
          if (wdist < 14) {
            nearWeakHerbi._die(cellAt(nearWeakHerbi.x, nearWeakHerbi.y));
            this.energy += 3.0;
            this.weaponCD = 40;
          }
        }
        // Dépôt phéro[2] intense → signal "zone dangereuse" pour les Carni
        c.phero[2] = Math.min(1, c.phero[2] + 0.22);
        // Coût métabolique du mode CRISIS (sprint permanent)
        this.energy -= 0.008;
        if (this.energy > 18) this.energy = 18;
      }
      if (mode === 'SCAVENGE') {
        // Mange les nutriments du sol (historique de morts)
        const bite = Math.min(0.038, c.history * 0.22);
        c.history   = Math.max(0, c.history - bite);
        c.biomass   = Math.max(0, c.biomass  - bite*0.5);
        this.energy += bite * 4.8;  // nourriture très dense en énergie
        // Fertilise autour (décomposition accélérée)
        c.fertility = Math.min(1, c.fertility + bite*0.55);
        for (let dxx=-1;dxx<=1;dxx++) for (let dyy=-1;dyy<=1;dyy++) {
          const nx=gxO+dxx, ny=gyO+dyy;
          if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID)
            world[nx][ny].fertility = Math.min(1, world[nx][ny].fertility + bite*0.15);
        }
      }

      // ─── MODE GUARD ───────────────────────────────────────
      if (mode === 'GUARD') {
        // Traque les Carni proches et leur retire de l'énergie (mobbing)
        const guardR2 = 75*75;
        let targetCarni = null, tcDist = 1e9;
        for (const o of organisms) {
          if (o.dead||o.sid!==1) continue;
          let dx2=o.x-this.x; if(dx2>W*0.5)dx2-=W; if(dx2<-W*0.5)dx2+=W;
          const dy2=deltaY(this.y,o.y);
          const d2=dx2*dx2+dy2*dy2;
          if (d2<guardR2 && d2<tcDist) { targetCarni=o; tcDist=d2; }
        }
        if (targetCarni) {
          const dist = Math.sqrt(tcDist);
          // Harcèlement : drain progressif + ralentit la prédation
          const harassDmg = dist < 20 ? 0.045 : 0.018;
          targetCarni.energy -= harassDmg;
          this.energy        += harassDmg * 0.4;
          // Coût du guard
          this.energy -= 0.006;
        }
        // Dépose phéromone de sécurité sur la zone (Herbi reçoit un bonus)
        c.phero[2] = Math.min(1, c.phero[2] + 0.10);
        const nearHerbis = organisms.filter(o=>
          !o.dead && o.sid===0 &&
          (()=>{let _dx=o.x-this.x; if(_dx>W*0.5)_dx-=W; if(_dx<-W*0.5)_dx+=W; const _dy=deltaY(this.y,o.y); return _dx*_dx+_dy*_dy;})() < 55*55
        );
        for (const h of nearHerbis) h.energy += 0.006;  // sécurité = économie de stress
      }

      // ─── MODE DRAIN ───────────────────────────────────────
      if (mode === 'DRAIN' && nearHost) {
        const drain = hostDist < 8 ? 0.030 : 0.012;
        nearHost.energy -= drain;
        this.energy     += drain * 0.85;
        if (nearHost.energy <= 0) {
          nearHost._die(cellAt(nearHost.x, nearHost.y));
          this.energy += 1.8;
        }
      }

      // ─── MODE CULL ────────────────────────────────────────
      if (mode === 'CULL' && this.weaponCD === 0) {
        // Cible le Herbi le plus faible dans un rayon donné
        let weakest=null, wEnergy=1e9;
        for (const o of organisms) {
          if (o.dead||o.sid!==0) continue;
          let dx2=o.x-this.x; if(dx2>W*0.5)dx2-=W; if(dx2<-W*0.5)dx2+=W;
          const dy2=deltaY(this.y,o.y);
          if (dx2*dx2+dy2*dy2 < 60*60 && o.energy < wEnergy) {
            wEnergy=o.energy; weakest=o;
          }
        }
        if (weakest && weakest.energy < 7.0) {
          // Ne tue que les Herbi déjà affaiblis (régulateur, pas prédateur)
          const shield = Math.min(0.35, (weakest._herdCount||0)*0.08);
          if (Math.random() > shield) {
            weakest._die(cellAt(weakest.x, weakest.y));
            this.energy += 2.2;
          }
          this.weaponCD = 65;
        }
      }

      // ─── MODE TEND ────────────────────────────────────────
      if (mode === 'TEND') {
        const poorFert = c.fertility < 0.45;
        if (poorFert) {
          const tend = 0.00028;
          c.fertility = Math.min(1, c.fertility + tend);
          c.stress    = Math.max(0, c.stress    - tend*0.5);
          this.energy -= 0.0008;
        }
        // v38: bite 0.012→0.022, rendement 0.45→0.85
        const bite2 = Math.min(0.022, c.biomass);
        c.biomass   -= bite2;
        this.energy += bite2 * 0.85;
        const closeHerb = organisms.find(o=>
          !o.dead && o.sid===0 &&
          (()=>{let _dx=o.x-this.x; if(_dx>W*0.5)_dx-=W; if(_dx<-W*0.5)_dx+=W; const _dy=deltaY(this.y,o.y); return _dx*_dx+_dy*_dy;})() < 80
        );
        if (closeHerb) {
          closeHerb.energy += 0.022; // v38
          this.energy      += 0.012; // v38
        }
      }

      // ─── Score d'équilibre global (bonus universel) ───────
      const idealH=total*0.55, idealC=total*0.28, idealO=total*0.17;
      const eqScore = 1 - Math.min(1,
        (Math.abs(Hp-idealH)+Math.abs(Cp-idealC)+Math.abs(Op-idealO))/(total+1)
      );
      this.energy += 0.016 * eqScore;

      // ─── Malus extinction partielle ───────────────────────
      if (Hp===0 || Cp===0) this.energy -= 0.022;

      // ─── Cap énergie Omni ─────────────────────────────────
      if (this.energy > 18) this.energy = 18;
    }

    // [3] HERBI → OMNI mob (seulement si Omni en mode CULL ou DRAIN)
    if (this.sid===0 && mobCount>=3 && nearOmni) {
      const dangerMode = nearOmni._omniMode==='CULL' || nearOmni._omniMode==='DRAIN';
      if (dangerMode) {
        nearOmni.energy -= 0.018 * Math.min(mobCount, 8) / 8;
      }
    }

    /* ── Herbivorie ─────────────────────────────── */
    if (this.sid===0) {
      const bite = Math.min(0.048, c.biomass);
      c.biomass   -= bite;
      this.energy += bite * 1.88;
      // v14 : bonus pâturage sur cellule luxuriante
      if (c.biomass > 0.65) this.energy += 0.005;
    } else if (this.sid===1) {
      const bite = Math.min(0.010, c.biomass);
      c.biomass   -= bite;
      this.energy += bite * 0.60;
    } else {
      // v29 Omni : biomasse seulement en mode TEND (géré dans son propre bloc)
      // et en DRAIN/GUARD/CULL modérément
      if (this._omniMode !== 'TEND' && this._omniMode !== 'SCAVENGE') {
        const bite = Math.min(0.006, c.biomass);
        c.biomass   -= bite;
        this.energy += bite * 0.22;
      }
    }

    /* ── Symbiose ────────────────────────────────── */
    if (symPart && symDist2<14) {
      this.energy    += 0.005;
      symPart.energy += 0.005;
    }

    /* ── Territoire ─────────────────────────────── */
    c.terrClaim = Math.min(1, c.terrClaim+0.015);
    c.terrOwner = this.lineage;
    c.terrSid   = this.sid;
    if (c.terrOwner===this.lineage) this.energy += 0.0018;

    /* ── Mémoire interne ─────────────────────────── */
    const delta = this.energy - 8;
    this.memory = this.memory*0.94 + delta*0.06;

    /* ── Plasticité synaptique ────────────────────── */
    const lr = 0.00014;
    for (let i=0;i<W_LEN;i++)
      this.brainW[i] += delta*lr*(Math.random()*2-1);

    /* ── Métabolisme v30+v36 ────────────────────────── */
    // Carni : métab de base réduit (0.0038→0.0026), dormance à 35%
    // v36 : surcoût de famine si ratio Carni/Herbi > 1.5 (compétition alimentaire)
    const famineExtra = (this.sid===1 && carniRatio > 1.5)
      ? Math.min(0.0045, (carniRatio - 1.5) * 0.0025)
      : 0;
    const mBase = this.sid===0 ? 0.0022
                : this.sid===1 ? (this._dormant ? 0.0009 : 0.0026 + famineExtra)
                :                0.0038; // v38
    const sMult  = Season.metabMult(this.sid);
    this.energy -= (mBase*this.metab + 0.0018*this.brainMass
                  + 0.0012*this.speed + 0.0006) * sMult;
    // Carni dormant : immobilité presque totale
    if (this._dormant) {
      this._lastDx *= 0.05;
      this._lastDy *= 0.05;
    }

    /* ── Soif v31 ────────────────────────────────── */
    {
      // Montée de la soif (métab × saison)
      const thirstRate = 0.00065 * this.metab * sMult;
      const droughtExtra = Climate.state==='drought' ? 0.00035 : 0;
      const summerExtra  = Season.current==='summer'  ? 0.00020 : 0;
      this.thirst = Math.min(1.02, this.thirst + thirstRate + droughtExtra + summerExtra);

      // Eau disponible (gel hivernal réduit de 50%)
      const winterFactor = Season.current==='winter' ? 0.5 : 1.0;
      const drinkable = c.moisture * winterFactor;

      // Boire
      if (drinkable > 0.30 && this.thirst > 0.05) {
        const intake   = Math.min(this.thirst * 0.18, drinkable * 0.12);
        this.thirst    = Math.max(0, this.thirst - intake * 2.2);
        this.hydration = Math.min(1, this.hydration + intake * 0.8);
        if (!c.waterBody) c.moisture = Math.max(0, c.moisture - intake * 0.04);
        // Hydratation complète → petit bonus d'énergie
        if (this.thirst < 0.15) this.energy += 0.003;
      }

      // Pénalités soif
      if (this.thirst > 0.45) this.energy -= (this.thirst - 0.45) * 0.010;
      if (this.thirst > 0.80) this.energy -= (this.thirst - 0.80) * 0.022;

      // Nudge cerveau vers eau si soif critique
      if (this.thirst > 0.60 && moistDx !== 0) {
        const wMag = Math.min(0.55, (this.thirst - 0.60) * 1.4);
        mx += moistDx * wMag * 0.2;
        my += moistDy * wMag * 0.2;
      }

      this.hydration *= 0.9998;
    }

    /* ── Surpopulation locale Herbi ──────────────── */
    if (this.sid===0) {
      // Une seule vérification (FIX v14 : était en double)
      if (herdCount > 6) this.energy -= 0.015;
    }

    /* ── Reproduction sexuée ─────────────────────── */
    // v38: Omni repro 12.0→10.5, Herbi min 15→10
    const reprThresh = this.sid===0 ? 9.0 : this.sid===1 ? 8.5 : 10.5;
    const reprCooldown = this.sid===0 ? 80 : this.sid===1 ? 110 : 130;

    // v30 : Carni peut se reproduire dès Herbi >= 18 (était 25)
    // v36 : PLAFOND RATIO — bloque si Carni > Herbi × 1.6 (surpopulation)
    const carniOverpop = this.sid===1 && carniRatio > 1.6;
    const carniReprBlocked = (this.sid===1 && popCache[0] < 18) || carniOverpop;
    const omniReprBlocked  = this.sid===2 && popCache[0] < 10; // v38: 15→10
    const reprBlocked = carniReprBlocked || omniReprBlocked;

    if (!reprBlocked &&
        this.energy>reprThresh && this.cooldown===0 && nearMate &&
        mateDist<14 && nearMate.energy>reprThresh && nearMate.cooldown===0) {
      this.energy     *= 0.54;
      nearMate.energy *= 0.54;
      this.cooldown    = reprCooldown;
      nearMate.cooldown = reprCooldown;
      const child = new Organism(this.sid, this, nearMate);
      child.culturalBias = (this.culturalBias + nearMate.culturalBias)/2
                           + (Math.random()*0.2-0.1);
      // v38 : héritage prestige (5%) si parent seigneur
      if (this.sid===2 && (this.isLord || nearMate.isLord)) {
        const lordP = this.isLord ? this : nearMate;
        child.lordPrestige = lordP.lordPrestige * 0.05;
      }
      checkSpeciation(this, child);
      births.push(child);
    }

    // Herbi reproduction asexuée de secours
    if (this.sid===0 && !nearMate && this.energy>11.5 && this.cooldown===0) {
      this.energy  *= 0.52;
      this.cooldown = 130;
      const child = new Organism(0, this, this);
      for (let i=0;i<child.brainW.length;i++)
        child.brainW[i] += (Math.random()*2-1)*0.12;
      births.push(child);
    }

    // v30 : Carni asexué amélioré — seuil 12.0 (était 18.0), pop < 10 (était 6)
    // v36 : bloqué aussi si ratio > 1.6
    if (this.sid===1 && !nearMate && this.energy>12.0 && this.cooldown===0
        && popCache[1] < 10 && carniRatio <= 1.6) {
      this.energy  *= 0.55;
      this.cooldown = 140;
      const child = new Organism(1, this, this);
      for (let i=0;i<child.brainW.length;i++)
        child.brainW[i] += (Math.random()*2-1)*0.10;
      births.push(child);
    }

    // v38 : Omni asexué de secours — pop < 12, seuil 11.5, cooldown 160
    if (this.sid===2 && !nearMate && this.energy>11.5 && this.cooldown===0
        && popCache[2] < 12) {
      this.energy  *= 0.56;
      this.cooldown = 160;
      const child = new Organism(2, this, this);
      for (let i=0;i<child.brainW.length;i++)
        child.brainW[i] += (Math.random()*2-1)*0.10;
      births.push(child);
    }

    // v38 : boost survie Omni critique
    if (this.sid===2 && popCache[2] < 8) {
      this.energy += Math.min(0.018, (8 - popCache[2]) * 0.003);
    }

    // v17: freine dès 220 Herbi
    if (this.sid===0 && popCache[0] > 220) {
      const excess = Math.min(1, (popCache[0]-220) / 200);
      this.energy -= 0.010 * excess;
    }
    // v36 : boost survie Herbi quand Carni surpeuplé
    if (this.sid===0 && carniRatio > 2.0) {
      this.energy += Math.min(0.012, (carniRatio - 2.0) * 0.006);
    }


    /* ── Traits sous-espèce v23 ─────────────────── */
    if ((this.subspecies||0) > 0) {
      // Chaque sous-espèce amplifie un trait selon son ID (mod 3)
      const trait = this.subspecies % 3;
      if (trait===0 && this.sid===0) this.energy += this.camo * 0.003;   // camouflage+
      if (trait===1) this.energy += 0.001 * this.speed;                   // vitesse+
      if (trait===2 && this.sid===0) this.energy += this.toxin * 0.002;  // toxine+
    }

    /* ── Capacités culturelles v28 ──────────────── */
    const ab = this.abilities;
    // TOOL USE : extraction de biomasse améliorée
    if (ab.toolUse?.active && (this.sid===0||this.sid===2)) {
      const extraBite = Math.min(0.010, c.biomass * 0.12);
      c.biomass  -= extraBite;
      this.energy += extraBite * 1.6;
      ab.toolUse.usage++;
    }
    // COMMUNICATION : signal d'alarme amplifié + rayon étendu
    if (ab.communication?.active && this.sid===0 && carniNear) {
      c.phero[0] = Math.min(1, c.phero[0] + 0.48);
      ab.communication.usage++;
    }
    // MIGRATION saisonnière (tous les organismes)
    if (ab.migration?.active) {
      const s = Season.current;
      if (s==='autumn' || s==='winter') {
        // Migration vers le sud (y croissant)
        this.y = wrapY(this.y + 0.22);
        this.energy -= 0.0005;
      } else if (s==='spring') {
        this.y = wrapY(this.y - 0.18);
      }
      ab.migration.usage++;
    }
    // GROUP HUNTING : Carni avec capacité = pack plus efficace
    if (ab.groupHunting?.active && this.sid===1) {
      this._groupHunter = true;
      ab.groupHunting.usage++;
    }
    // ÉPIDÉMIE : effets sur les infectés v28
    if (this.infected && Pathogen.active) {
      this.energy -= Pathogen.virulence * 0.005;
      this.immunity = Math.min(1, this.immunity + 0.0002);
      if (Math.random() < 0.0008) {  // guérison spontanée
        this.infected = false;
        this.immunity = Math.min(1, this.immunity + 0.35);
      }
    }
    if (this.immunity > 0) this.immunity *= 0.99995;  // déclin lent

    /* ── Mort ───────────────────────────────────── */
    const maxAge = this.sid===0 ? 12000 : 8200;
    if (this.energy<=0 || this.age>maxAge) this._die(c);
  }

  _die(c) {
    if (c) {
      const biomDrop = this.sid===0 ? 0.55 : 0.30;
      const fertDrop = this.sid===0 ? 0.04 : 0.02;
      c.biomass   = Math.min(1, c.biomass   + biomDrop);
      c.fertility = Math.min(1, c.fertility + fertDrop);
      c.history   = Math.min(1, c.history   + 0.018);

      const gx=(this.x/CW)|0, gy=(this.y/CH)|0;
      for (let dx=-1;dx<=1;dx++) {
        for (let dy=-1;dy<=1;dy++) {
          if (dx===0&&dy===0) continue;
          const nx=gx+dx, ny=gy+dy;
          if (nx>=0&&nx<GRID&&ny>=0&&ny<GRID) {
            world[nx][ny].biomass   = Math.min(1, world[nx][ny].biomass   + biomDrop*0.25);
            world[nx][ny].fertility = Math.min(1, world[nx][ny].fertility + fertDrop*0.20);
          }
        }
      }
    }
    this.dead = true;
  }

  draw() {
    if (this.dead) return;
    const px = this.x|0, py = this.y|0;
    // v23 : taille encodée brainMass (plus gros = cerveau plus développé)
    const brainSz = 1.4 + this.brainMass * 0.6;
    const sz  = Math.max(1.5, Math.min(6.2, brainSz+this.energy*0.14));
    const aged = this.age > 4800;
    const col  = sCol(this.sid, this.lineage, aged?38:80, aged?46:65, this.subspecies||0);

    const cc    = cellAt(this.x, this.y);
    const camoA = this.sid===0
      ? Math.max(0.28, 1 - (this.camo*(cc?cc.biomass:0)*0.80))
      : 1.0;

    // v14 : traînée de fuite Herbi
    if (this.sid===0 && this._carniNear) {
      const tdx = this._lastDx, tdy = this._lastDy;
      for (let t=1;t<=4;t++) {
        ctx.globalAlpha = (0.10-t*0.022) * camoA;
        ctx.fillStyle   = col;
        const s2 = Math.max(1,((sz|0)-1));
        ctx.fillRect((px-tdx*t)|0, (py-tdy*t)|0, s2, s2);
      }
    }

    if (this.energy>4.5) {
      ctx.globalAlpha = Math.min(0.28, 0.08+this.energy*0.016) * camoA;
      ctx.fillStyle   = col;
      ctx.beginPath();
      ctx.arc(px,py,sz+3.8,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = camoA;
    ctx.fillStyle   = col;

    const s = Math.max(2,sz)|0;

    if (this.sid===0) {
      // v23 : halo toxine (rouge pulsant si toxin > 0.3)
      if (this.toxin > 0.3) {
        ctx.globalAlpha = (this.toxin - 0.3) * 0.4 * camoA;
        ctx.fillStyle   = '#ff2200';
        ctx.beginPath();
        ctx.arc(px, py, sz+3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = camoA;
        ctx.fillStyle   = col;
      }
      // v23 : halo essaim vert lumineux si groupe >= 5
      const hc=this._herdCount||0;
      if (hc >= 5) {
        ctx.globalAlpha = Math.min(0.22, hc*0.03)*camoA;
        ctx.fillStyle   = '#00ffaa';
        ctx.beginPath();
        ctx.arc(px,py,sz+5+Math.min(hc-5,4),0,Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = camoA;
        ctx.fillStyle   = col;
      } else if (hc>=3) {
        ctx.globalAlpha=Math.min(0.18,hc*0.04)*camoA;
        ctx.fillStyle='#44ff44';
        ctx.beginPath();
        ctx.arc(px,py,sz+5,0,Math.PI*2);
        ctx.fill();
        ctx.globalAlpha=camoA;
        ctx.fillStyle=col;
      }
      // v18 : halo alarme jaune
      if (this._alarmEmit) {
        ctx.globalAlpha = 0.35 * camoA;
        ctx.fillStyle   = '#ffee00';
        ctx.beginPath();
        ctx.arc(px, py, sz+6, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = camoA;
        ctx.fillStyle   = col;
      }
      ctx.fillRect(px-s, py,   s*2+1, 1);
      ctx.fillRect(px,   py-s, 1,     s*2+1);
      const toxR=(255*this.toxin)|0;
      ctx.fillStyle=`rgba(${toxR},255,100,0.7)`;
      ctx.fillRect(px,py,1,1);
      // v23 : point blanc si sous-espèce
      if (this.subspecies > 0) {
        ctx.fillStyle='rgba(255,255,255,0.8)';
        ctx.fillRect(px-1,py-1,2,2);
      }
    } else if (this.sid===1) {
      const pk = this._packNear || 0;
      const cm = this._carniMode || 'STALK';

      // Couleur halo selon mode
      const haloCol = cm==='PACK'      ? (pk>=3?'#ff2200':'#ff6600')
                    : cm==='AMBUSH'    ? '#ffaa00'
                    : cm==='TERRITORY' ? '#cc44ff'
                    : cm==='DORMANCY'  ? '#223355'
                    :                   '#882200';  // STALK discret

      if (cm==='DORMANCY') {
        // Dormant : très transparent, taille réduite
        ctx.globalAlpha = 0.35;
        ctx.fillStyle   = '#334466';
        const ds = Math.max(1.2, sz*0.6)|0;
        ctx.beginPath();
        ctx.moveTo(px,py-ds); ctx.lineTo(px+ds,py);
        ctx.lineTo(px,py+ds); ctx.lineTo(px-ds,py);
        ctx.closePath(); ctx.fill();
      } else {
        if (pk >= 2 || cm==='AMBUSH' || cm==='TERRITORY') {
          const halor = cm==='TERRITORY' ? sz+7+2 : sz+4+pk;
          ctx.globalAlpha = cm==='AMBUSH' ? 0.35 : Math.min(0.25, pk*0.05+0.08);
          ctx.fillStyle = haloCol;
          ctx.beginPath(); ctx.arc(px,py,halor,0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(px,py-s); ctx.lineTo(px+s,py);
        ctx.lineTo(px,py+s); ctx.lineTo(px-s,py);
        ctx.closePath(); ctx.fill();
        // Anneau de territoire (mode TERRITORY)
        if (cm==='TERRITORY') {
          ctx.strokeStyle='rgba(180,60,255,0.55)';
          ctx.lineWidth=1.0;
          ctx.beginPath(); ctx.arc(px,py,sz+7,0,Math.PI*2); ctx.stroke();
        }
        // v35 : point de territoire — petit carré au centre de territoire
        if (this.territory) {
          const tx=(this.territory.x)|0, ty=(this.territory.y)|0;
          const tdx=tx-px, tdy=ty-py;
          const td=Math.sqrt(tdx*tdx+tdy*tdy);
          if (td > 30) {
            ctx.globalAlpha=0.22;
            ctx.strokeStyle='rgba(255,120,60,0.6)';
            ctx.lineWidth=0.5;
            ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(tx,ty); ctx.stroke();
          }
          ctx.globalAlpha=0.50;
          ctx.fillStyle='rgba(255,100,30,0.7)';
          ctx.fillRect(tx-1,ty-1,3,3);
        }
        // Croix d'ambush (mode AMBUSH prêt)
        if (cm==='AMBUSH' && this._ambushReady) {
