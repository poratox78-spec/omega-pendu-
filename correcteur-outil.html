<div class="tool-wrap">
  <iframe id="app" class="tool" src="app/omega-pendu.html" title="Correcteur OMEGA-Ω" loading="eager"></iframe>
  <div class="tool-load" id="loading"><div class="sp"></div><div>Chargement du correcteur…</div></div>
</div>
<script>
(function(){
  var TOOL='vdc';   // correcteur (vdc) · dictée (vdd) · décompose (vdk)
  var f=document.getElementById('app'), load=document.getElementById('loading');
  function fail(msg){ load.innerHTML='<div>'+(msg||"L'outil tarde à charger.")+'</div><div><a href="app/omega-pendu.html">Ouvrir l\'application directement →</a></div>'; }
  f.addEventListener('load', function(){
    var doc; try{ doc=f.contentDocument||f.contentWindow.document; }catch(e){ fail('Outil non accessible ici.'); return; }
    var n=0, iv=setInterval(function(){
      var btn=doc.getElementById(TOOL+'-btn');
      if(btn){
        clearInterval(iv);
        var s=doc.createElement('style');
        s.textContent='#'+TOOL+'-ov{background:#0d1117!important;align-items:flex-start!important;padding:20px 0!important}'
          +'#'+TOOL+'-card{width:min(96vw,1080px)!important;max-height:calc(100vh - 40px)!important;margin:0 auto!important}'
          +'#vdc-in{min-height:40vh!important;font-size:19px!important}#vdc-render{min-height:16vh!important}'   // saisie + rendu : exploiter la hauteur
          +'#vdc-btn,#vdd-btn,#vdk-btn{display:none!important}'
          +'#'+TOOL+'-x{display:none!important}';
        doc.head.appendChild(s);
        try{ btn.click(); }catch(e){}
        setTimeout(function(){ load.style.display='none'; }, 200);
      } else if(++n>250){ clearInterval(iv); fail(); }
    }, 80);
  });
})();
</script>

<script>if('serviceWorker' in navigator && location.protocol.lastIndexOf('http',0)===0){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
